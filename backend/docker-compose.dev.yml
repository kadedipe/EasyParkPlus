version: '3.8'

services:
  backend:
    build:
      context: .
      target: development
    volumes:
      - ./:/app
      - /app/__pycache__
      - /app/.pytest_cache
      - ./logs:/app/logs
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - RELOAD=true
    ports:
      - "8000:8000"
      - "5678:5678"  # Debug port
    command: uvicorn parking-api.main:app --host 0.0.0.0 --port 8000 --reload