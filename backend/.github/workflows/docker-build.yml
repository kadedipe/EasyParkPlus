name: Docker Build

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build development image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: development
          push: false
          tags: parking-backend:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: false
          tags: parking-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max