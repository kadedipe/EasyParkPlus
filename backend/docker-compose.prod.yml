version: '3.8'

services:
  backend:
    build:
      context: .
      target: production
      args:
        - APP_VERSION=${APP_VERSION:-1.0.0}
        - BUILD_DATE=${BUILD_DATE:-}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-parking-backend}:${TAG:-latest}
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    env_file:
      - .env.production
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - parking-network