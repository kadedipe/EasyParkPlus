apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-ingress
  namespace: parking-system
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/plugins: rate-limiting,cors,prometheus
    konghq.com/strip-path: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: kong
  tls:
  - hosts:
    - api.parking.example.com
    secretName: tls-secret
  rules:
  - host: api.parking.example.com
    http:
      paths:
      - path: /api/v1/parking
        pathType: Prefix
        backend:
          service:
            name: parking-api-service
            port:
              number: 8080
      - path: /api/v1/users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8080
      - path: /api/v1/payments
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 8080
      - path: /api/v1/notifications
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 8080
      - path: /api/v1/analytics
        pathType: Prefix
        backend:
          service:
            name: analytics-service
            port:
              number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kong-ingress-controller
  namespace: parking-system
  labels:
    app: kong-ingress-controller
spec:
  selector:
    app: kong
  ports:
  - name: ingress-proxy
    port: 80
    targetPort: 8000
  - name: ingress-proxy-ssl
    port: 443
    targetPort: 8443
  type: LoadBalancer