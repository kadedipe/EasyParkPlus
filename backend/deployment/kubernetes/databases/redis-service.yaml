apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-master
  namespace: parking-system
  labels:
    app: redis
    component: cache
    role: master
    version: "7.2"
    managed-by: kubectl
  annotations:
    description: "Redis master statefulset for parking system"
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels:
      app: redis
      role: master
  template:
    metadata:
      labels:
        app: redis
        role: master
        component: cache
        version: "7.2"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        command:
        - /bin/sh
        - -c
        - |
          /init.sh redis-server /usr/local/etc/redis/redis.conf
        ports:
        - containerPort: 6379
          name: redis
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: redis-config
          mountPath: /conf
        - name: redis-data
          mountPath: /data
        - name: init-script
          mountPath: /init.sh
          subPath: init.sh
        - name: redis-socket
          mountPath: /var/run/redis
        - name: redis-log
          mountPath: /var/log/redis
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                redis-cli -a $REDIS_PASSWORD shutdown
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
      
      - name: redis-exporter
        image: oliver006/redis_exporter:latest
        ports:
        - containerPort: 9121
          name: metrics
        env:
        - name: REDIS_ADDR
          value: redis://localhost:6379
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        - name: REDIS_EXPORTER_LOG_FORMAT
          value: json
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
      
      volumes:
      - name: redis-config
        configMap:
          name: redis-config
          defaultMode: 0644
          items:
          - key: redis.conf
            path: redis.conf
      - name: init-script
        configMap:
          name: redis-config
          defaultMode: 0755
          items:
          - key: init.sh
            path: init.sh
      - name: redis-socket
        emptyDir: {}
      - name: redis-log
        emptyDir: {}
      
      serviceAccountName: redis-sa
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: workload-type
                operator: In
                values:
                - cache
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - redis
              - key: role
                operator: In
                values:
                - master
            topologyKey: kubernetes.io/hostname
      
      terminationGracePeriodSeconds: 60
      
  volumeClaimTemplates:
  - metadata:
      name: redis-data
      namespace: parking-system
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
