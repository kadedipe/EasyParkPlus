  name: redis-replica
  namespace: parking-system
  labels:
    app: redis
    component: cache
    role: replica
    version: "7.2"
    managed-by: kubectl
  annotations:
    description: "Redis replica statefulset for read scaling"
spec:
  serviceName: redis-headless
  replicas: 2
  selector:
    matchLabels:
      app: redis
      role: replica
  template:
    metadata:
      labels:
        app: redis
        role: replica
        component: cache
        version: "7.2"
      annotations:
        prometheus.io/scrape: "true"
