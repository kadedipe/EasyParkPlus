apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: parking-system
  labels:
    app: redis
    component: cache
    version: "7.2"
    managed-by: kubectl
  annotations:
    description: "Redis configuration for parking management system caching"
data:
  redis.conf: |
    # Redis configuration for parking management system
    
    # Network
    bind 0.0.0.0
    port 6379
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
    
    # General
    daemonize no
    supervised no
    pidfile /var/run/redis/redis-server.pid
    loglevel notice
    logfile /var/log/redis/redis-server.log
    databases 16
    
    # Snapshots (RDB)
    save 900 1
    save 300 10
    save 60 10000
    stop-writes-on-bgsave-error yes
    rdbcompression yes
    rdbchecksum yes
    dbfilename dump.rdb
    dir /data
    
    # Replication
    replica-serve-stale-data yes
    replica-read-only yes
    repl-diskless-sync yes
    repl-diskless-sync-delay 5
    repl-disable-tcp-nodelay no
    replica-priority 100
    
    # Security
    rename-command CONFIG ""
    requirepass ${REDIS_PASSWORD}
    masterauth ${REDIS_PASSWORD}
    
    # Memory Management
    maxmemory 256mb
    maxmemory-policy allkeys-lru
    maxmemory-samples 5
    
    # Append Only Mode (AOF)
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
    no-appendfsync-on-rewrite no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    aof-load-truncated yes
    aof-use-rdb-preamble yes
    
    # Slow Log
    slowlog-log-slower-than 10000
    slowlog-max-len 128
    
    # Advanced
    hash-max-ziplist-entries 512
    hash-max-ziplist-value 64
    list-max-ziplist-size -2
    list-compress-depth 0
    set-max-intset-entries 512
    zset-max-ziplist-entries 128
    zset-max-ziplist-value 64
    hll-sparse-max-bytes 3000
    stream-node-max-bytes 4096
    stream-node-max-entries 100
    activerehashing yes
    client-output-buffer-limit normal 0 0 0
    client-output-buffer-limit replica 256mb 64mb 60
    client-output-buffer-limit pubsub 32mb 8mb 60
    hz 10
    dynamic-hz yes
    aof-rewrite-incremental-fsync yes
    rdb-save-incremental-fsync yes
    
  redis-sentinel.conf: |
    # Redis Sentinel configuration
    
    port 26379
    daemonize no
    pidfile /var/run/redis/redis-sentinel.pid
    logfile /var/log/redis/redis-sentinel.log
    
    sentinel monitor parking-master redis-master.parking-system.svc.cluster.local 6379 2
    sentinel down-after-milliseconds parking-master 5000
    sentinel failover-timeout parking-master 10000
    sentinel parallel-syncs parking-master 1
    sentinel auth-pass parking-master ${REDIS_PASSWORD}
    
  init.sh: |
    #!/bin/sh
    set -e
    
    # Generate redis password if not set
    if [ -z "${REDIS_PASSWORD}" ]; then
      export REDIS_PASSWORD=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 32 | head -n 1)
      echo "Generated random Redis password"
    fi
    
    # Create config from template
    envsubst < /conf/redis.conf > /usr/local/etc/redis/redis.conf
    
    # Set proper permissions
    chmod 600 /usr/local/etc/redis/redis.conf
    
    # Create log directory
    mkdir -p /var/log/redis
    chmod 755 /var/log/redis
    
    # Execute any custom scripts
    if [ -d /docker-entrypoint-initdb.d ]; then
      for f in /docker-entrypoint-initdb.d/*; do
        case "$f" in
          *.sh)     echo "$0: running $f"; . "$f" ;;
          *)        echo "$0: ignoring $f" ;;
        esac
      done
    fi
    
    exec "$@"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: parking-system
  labels:
    app: redis
    component: cache
    managed-by: kubectl
  annotations:
    description: "Redis authentication credentials"
type: Opaque
data:
  # Default values - replace with actual base64 encoded values
  # echo -n "your-redis-password" | base64
  REDIS_PASSWORD: cGFya2luZ3JlZGlzcGFzc3dvcmQ=  # parkingredispassword
  REDIS_SENTINEL_PASSWORD: cGFya2luZ3JlZGlzc2VudGluZWxwYXNzd29yZA==  # parkingredissentinelpassword
---
