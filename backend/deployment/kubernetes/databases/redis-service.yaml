        image: redis:7.2-alpine
        command:
        - /bin/sh
        - -c
        - |
          /init.sh redis-server /usr/local/etc/redis/redis.conf --replicaof redis-master-0.redis-headless.parking-system.svc.cluster.local 6379
        ports:
        - containerPort: 6379
          name: redis
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        volumeMounts:
        - name: redis-config
          mountPath: /conf
        - name: redis-data
          mountPath: /data
        - name: init-script
          mountPath: /init.sh
          subPath: init.sh
        - name: redis-socket
          mountPath: /var/run/redis
        - name: redis-log
          mountPath: /var/log/redis
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 15
          periodSeconds: 5
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
      
      - name: redis-exporter
        image: oliver006/redis_exporter:latest
        ports:
        - containerPort: 9121
          name: metrics
        env:
        - name: REDIS_ADDR
          value: redis://localhost:6379
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
      
      volumes:
      - name: redis-config
        configMap:
          name: redis-config
          defaultMode: 0644
          items:
          - key: redis.conf
            path: redis.conf
      - name: init-script
        configMap:
          name: redis-config
          defaultMode: 0755
          items:
          - key: init.sh
            path: init.sh
      - name: redis-socket
        emptyDir: {}
      - name: redis-log
        emptyDir: {}
      
      serviceAccountName: redis-sa
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - redis
                - key: role
                  operator: In
                  values:
                  - replica
              topologyKey: kubernetes.io/hostname
      
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-sentinel
  namespace: parking-system
  labels:
    app: redis-sentinel
    component: sentinel
    version: "7.2"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: redis-sentinel
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: redis-sentinel
        component: sentinel
        version: "7.2"
    spec:
      containers:
      - name: sentinel
        image: redis:7.2-alpine
        command:
        - /bin/sh
        - -c
        - |
          envsubst < /conf/redis-sentinel.conf > /etc/redis/redis-sentinel.conf
          redis-sentinel /etc/redis/redis-sentinel.conf
        ports:
        - containerPort: 26379
          name: sentinel
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        volumeMounts:
        - name: sentinel-config
          mountPath: /conf
        - name: sentinel-data
          mountPath: /data
        - name: sentinel-log
          mountPath: /var/log/redis
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - -p
            - "26379"
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - -p
            - "26379"
            - sentinel
            - master
            - parking-master
          initialDelaySeconds: 15
          periodSeconds: 5
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
      
      volumes:
      - name: sentinel-config
        configMap:
          name: redis-config
          defaultMode: 0644
          items:
          - key: redis-sentinel.conf
            path: redis-sentinel.conf
      - name: sentinel-data
        emptyDir: {}
      - name: sentinel-log
        emptyDir: {}
      
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - redis-sentinel
            topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-sa
  namespace: parking-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redis
  namespace: parking-system
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redis
  namespace: parking-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redis
subjects:
- kind: ServiceAccount
  name: redis-sa
  namespace: parking-system
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: redis-replica-hpa
  namespace: parking-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: redis-replica
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: parking-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: redis
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-network-policy
  namespace: parking-system
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          component: backend
    - podSelector:
        matchLabels:
          app: parking-api
    - namespaceSelector:
        matchLabels:
          name: parking-monitoring
      podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 9121
    - protocol: TCP
      port: 26379
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 26379
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-cache-cleanup
  namespace: parking-system
spec:
  schedule: "0 4 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: redis-cleanup
            image: redis:7.2-alpine
            command:
            - /bin/sh
            - -c
            - |
              redis-cli -h redis-master-service -a $REDIS_PASSWORD EVAL "return redis.call('DEL', unpack(redis.call('KEYS', ARGV[1])))" 0 "session:*:expired"
              redis-cli -h redis-master-service -a $REDIS_PASSWORD EVAL "return redis.call('DEL', unpack(redis.call('KEYS', ARGV[1])))" 0 "temp:*"
            env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          restartPolicy: OnFailure
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-scripts
  namespace: parking-system
data:
  backup.sh: |
    #!/bin/sh
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    redis-cli -h redis-master-service -a $REDIS_PASSWORD --rdb /backups/redis_dump_${TIMESTAMP}.rdb
    echo "Redis backup completed: redis_dump_${TIMESTAMP}.rdb"
    # Keep only last 7 days of backups
    find /backups -name "redis_dump_*.rdb" -type f -mtime +7 -delete
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-backup
  namespace: parking-system
spec:
  schedule: "0 */6 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: redis-backup
            image: redis:7.2-alpine
            command:
            - /bin/sh
            - -c
            - |
              /scripts/backup.sh
            env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: backups
              mountPath: /backups
          volumes:
          - name: scripts
            configMap:
              name: redis-scripts
              defaultMode: 0755
          - name: backups
            persistentVolumeClaim:
              claimName: redis-backup-pvc
          restartPolicy: OnFailure
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-backup-pvc
  namespace: parking-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-external
