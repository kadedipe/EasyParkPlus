apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-providers
  namespace: parking-monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    
    providers:
    - name: 'parking-system'
      orgId: 1
      folder: 'Parking System'
      folderUid: ''
      type: file
      disableDeletion: false
      editable: true
      updateIntervalSeconds: 30
      options:
        path: /var/lib/grafana/dashboards/parking-system
    
    - name: 'infrastructure'
      orgId: 1
      folder: 'Infrastructure'
      folderUid: ''
      type: file
      disableDeletion: false
      editable: true
      updateIntervalSeconds: 30
      options:
        path: /var/lib/grafana/dashboards/infrastructure
    
    - name: 'databases'
      orgId: 1
      folder: 'Databases'
      folderUid: ''
      type: file
      disableDeletion: false
      editable: true
      updateIntervalSeconds: 30
      options:
        path: /var/lib/grafana/dashboards/databases
    
    - name: 'caching'
      orgId: 1
      folder: 'Caching'
      folderUid: ''
      type: file
      disableDeletion: false
      editable: true
      updateIntervalSeconds: 30
      options:
        path: /var/lib/grafana/dashboards/caching
    
    - name: 'apis'
      orgId: 1
      folder: 'APIs'
      folderUid: ''
      type: file
      disableDeletion: false
      editable: true
      updateIntervalSeconds: 30
      options:
        path: /var/lib/grafana/dashboards/apis
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-dashboard
  namespace: parking-monitoring
  labels:
    grafana_dashboard: "1"
data:
  home.json: |
    {
      "title": "Parking Management System Overview",
      "uid": "parking-overview",
      "version": 1,
      "panels": [],
      "time": {
        "from": "now-6h",
        "to": "now"
      }
    }