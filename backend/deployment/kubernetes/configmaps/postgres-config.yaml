apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: parking-system
data:
  POSTGRES_DB: "parking_db"
  POSTGRES_USER: "parking_admin"
  POSTGRES_PORT: "5432"
  PGDATA: "/var/lib/postgresql/data/pgdata"
  POSTGRES_MAX_CONNECTIONS: "200"
  POSTGRES_SHARED_BUFFERS: "1GB"
  POSTGRES_EFFECTIVE_CACHE_SIZE: "3GB"
  POSTGRES_MAINTENANCE_WORK_MEM: "256MB"
  POSTGRES_CHECKPOINT_COMPLETION_TARGET: "0.9"
  POSTGRES_WAL_BUFFERS: "16MB"
  POSTGRES_DEFAULT_STATISTICS_TARGET: "100"
  POSTGRES_RANDOM_PAGE_COST: "1.1"
  POSTGRES_EFFECTIVE_IO_CONCURRENCY: "200"
  POSTGRES_WORK_MEM: "16MB"
  POSTGRES_MIN_WAL_SIZE: "1GB"
  POSTGRES_MAX_WAL_SIZE: "2GB"
  POSTGRES_MAX_WORKER_PROCESSES: "8"
  POSTGRES_MAX_PARALLEL_WORKERS: "8"
  POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER: "4"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: parking-system
data:
  init.sql: |
    -- Create extensions
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";
    CREATE EXTENSION IF NOT EXISTS "btree_gin";
    CREATE EXTENSION IF NOT EXISTS "postgis";
    
    -- Create schemas
    CREATE SCHEMA IF NOT EXISTS parking;
    CREATE SCHEMA IF NOT EXISTS users;
    CREATE SCHEMA IF NOT EXISTS payments;
    CREATE SCHEMA IF NOT EXISTS notifications;
    CREATE SCHEMA IF NOT EXISTS analytics;
    
    -- Set search path
    ALTER DATABASE parking_db SET search_path TO parking, users, payments, notifications, analytics, public;
    
    -- Create roles
    CREATE ROLE readonly;
    CREATE ROLE readwrite;
    
    -- Grant permissions
    GRANT CONNECT ON DATABASE parking_db TO readonly;
    GRANT CONNECT ON DATABASE parking_db TO readwrite;
    GRANT USAGE ON SCHEMA parking TO readonly;
    GRANT USAGE ON SCHEMA users TO readonly;
    GRANT USAGE ON SCHEMA payments TO readonly;
    GRANT SELECT ON ALL TABLES IN SCHEMA parking TO readonly;
    GRANT SELECT ON ALL TABLES IN SCHEMA users TO readonly;
    GRANT SELECT ON ALL TABLES IN SCHEMA payments TO readonly;
    
    -- Create tables
    CREATE TABLE parking.spots (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        spot_number VARCHAR(20) NOT NULL UNIQUE,
        location GEOGRAPHY(POINT, 4326),
        floor INTEGER,
        section VARCHAR(50),
        type VARCHAR(50),
        is_available BOOLEAN DEFAULT TRUE,
        is_handicapped BOOLEAN DEFAULT FALSE,
        is_ev_charging BOOLEAN DEFAULT FALSE,
        hourly_rate DECIMAL(10,2),
        created_at TIMESTAMP DEFAULT NOW(),
        updated_at TIMESTAMP DEFAULT NOW()
    );
    
    CREATE TABLE parking.reservations (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        spot_id UUID REFERENCES parking.spots(id),
        user_id UUID NOT NULL,
        vehicle_plate VARCHAR(20) NOT NULL,
        start_time TIMESTAMP NOT NULL,
        end_time TIMESTAMP NOT NULL,
        status VARCHAR(20) DEFAULT 'pending',
        total_amount DECIMAL(10,2),
        payment_status VARCHAR(20) DEFAULT 'pending',
        payment_id UUID,
        created_at TIMESTAMP DEFAULT NOW(),
        updated_at TIMESTAMP DEFAULT NOW()
    );
    
    CREATE TABLE parking.sessions (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        reservation_id UUID REFERENCES parking.reservations(id),
        spot_id UUID REFERENCES parking.spots(id),
        user_id UUID NOT NULL,
        vehicle_plate VARCHAR(20) NOT NULL,
        start_time TIMESTAMP NOT NULL,
        end_time TIMESTAMP,
        duration_minutes INTEGER,
        total_amount DECIMAL(10,2),
        status VARCHAR(20) DEFAULT 'active',
        created_at TIMESTAMP DEFAULT NOW(),
        updated_at TIMESTAMP DEFAULT NOW()
    );
    
    CREATE TABLE users.profiles (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        email VARCHAR(255) UNIQUE NOT NULL,
        phone VARCHAR(20),
        first_name VARCHAR(100),
        last_name VARCHAR(100),
        role VARCHAR(50) DEFAULT 'user',
        is_active BOOLEAN DEFAULT TRUE,
        last_login TIMESTAMP,
        created_at TIMESTAMP DEFAULT NOW(),
        updated_at TIMESTAMP DEFAULT NOW()
    );
    
    CREATE TABLE users.vehicles (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        user_id UUID REFERENCES users.profiles(id),
        plate_number VARCHAR(20) NOT NULL,
        make VARCHAR(50),
        model VARCHAR(50),
        color VARCHAR(30),
        is_default BOOLEAN DEFAULT FALSE,
        created_at TIMESTAMP DEFAULT NOW(),
        updated_at TIMESTAMP DEFAULT NOW()
    );
    
    CREATE TABLE payments.transactions (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        user_id UUID NOT NULL,
        reservation_id UUID,
        amount DECIMAL(10,2) NOT NULL,
        currency VARCHAR(3) DEFAULT 'USD',
        payment_method VARCHAR(50),
        status VARCHAR(20) DEFAULT 'pending',
        gateway_transaction_id VARCHAR(255),
        error_message TEXT,
        created_at TIMESTAMP DEFAULT NOW(),
        updated_at TIMESTAMP DEFAULT NOW()
    );
    
    -- Create indexes
    CREATE INDEX idx_spots_location ON parking.spots USING GIST(location);
    CREATE INDEX idx_spots_available ON parking.spots(is_available) WHERE is_available = true;
    CREATE INDEX idx_reservations_user_id ON parking.reservations(user_id);
    CREATE INDEX idx_reservations_spot_id ON parking.reservations(spot_id);
    CREATE INDEX idx_reservations_time_range ON parking.reservations(start_time, end_time);
    CREATE INDEX idx_sessions_user_id ON parking.sessions(user_id);
    CREATE INDEX idx_sessions_status ON parking.sessions(status);
    CREATE INDEX idx_users_email ON users.profiles(email);
    CREATE INDEX idx_users_phone ON users.profiles(phone);
    CREATE INDEX idx_vehicles_plate ON users.vehicles(plate_number);
    CREATE INDEX idx_transactions_user_id ON payments.transactions(user_id);
    CREATE INDEX idx_transactions_status ON payments.transactions(status);
    
    -- Create functions
    CREATE OR REPLACE FUNCTION update_updated_at_column()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = NOW();
        RETURN NEW;
    END;
    $$ language 'plpgsql';
    
    -- Create triggers
    CREATE TRIGGER update_spots_updated_at BEFORE UPDATE ON parking.spots
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();
    
    CREATE TRIGGER update_reservations_updated_at BEFORE UPDATE ON parking.reservations
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();
    
    CREATE TRIGGER update_sessions_updated_at BEFORE UPDATE ON parking.sessions
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();
    
    CREATE TRIGGER update_users_updated_at BEFORE UPDATE ON users.profiles
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();
    
    CREATE TRIGGER update_transactions_updated_at BEFORE UPDATE ON payments.transactions
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();
    
    -- Create views
    CREATE VIEW parking.spot_availability AS
    SELECT 
        s.id,
        s.spot_number,
        s.floor,
        s.section,
        s.type,
        s.is_handicapped,
        s.is_ev_charging,
        s.hourly_rate,
        CASE 
            WHEN r.id IS NULL THEN true
            ELSE false
        END as is_available,
        r.end_time as next_available_time
    FROM parking.spots s
    LEFT JOIN parking.reservations r ON s.id = r.spot_id 
        AND r.status IN ('pending', 'confirmed') 
        AND NOW() BETWEEN r.start_time AND r.end_time;
    
    -- Create materialized views for analytics
    CREATE MATERIALIZED VIEW analytics.daily_occupancy AS
    SELECT 
        DATE(start_time) as date,
        COUNT(DISTINCT spot_id) as occupied_spots,
        COUNT(DISTINCT reservation_id) as total_reservations,
        AVG(duration_minutes) as avg_duration_minutes,
        SUM(total_amount) as total_revenue
    FROM parking.sessions
    GROUP BY DATE(start_time)
    WITH DATA;
    
    REFRESH MATERIALIZED VIEW analytics.daily_occupancy;