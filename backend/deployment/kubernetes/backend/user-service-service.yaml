apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: parking-system
  labels:
    app: user-service
    component: backend
    tier: microservice
    service-type: user-management
    version: "1.0.0"
    managed-by: kubectl
  annotations:
    description: "User management microservice for parking system"
    built-with: "spring-boot"
    repository: "parking-management/user-service"
data:
  # Application Configuration
  APP_NAME: "User Management Service"
  APP_ENV: "production"
  APP_PORT: "8080"
  APP_VERSION: "1.0.0"
  APP_TIMEZONE: "UTC"
  API_PREFIX: "/api/v1/users"
  API_DOCS_PATH: "/api-docs"
  API_DOCS_ENABLED: "false"
  
  # Service Discovery
  SERVICE_NAME: "user-service"
  SERVICE_HOST: "user-service.parking-system.svc.cluster.local"
  SERVICE_PORT: "8080"
  EUREKA_CLIENT_ENABLED: "true"
  EUREKA_SERVER_URL: "http://discovery-service:8761/eureka"
  
  # Database Configuration - Primary
  DB_HOST: "pgpool.parking-system.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "user_db"
  DB_SCHEMA: "users"
  DB_SSL_MODE: "require"
  DB_MAX_POOL_SIZE: "30"
  DB_MIN_IDLE: "5"
  DB_IDLE_TIMEOUT: "300000"
  DB_CONNECTION_TIMEOUT: "30000"
  DB_LEAK_DETECTION_THRESHOLD: "60000"
  DB_VALIDATION_TIMEOUT: "5000"
  
  # Read Replica Configuration
  DB_READER_HOST: "postgres-reader-service.parking-system.svc.cluster.local"
  DB_READER_PORT: "5432"
  DB_READER_NAME: "user_db"
  READ_REPLICA_ENABLED: "true"
  READ_WRITE_SPLIT: "true"
  
  # Redis Cache Configuration
  REDIS_HOST: "redis-master-service.parking-system.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "5"
  REDIS_CACHE_DB: "6"
  REDIS_SESSION_DB: "7"
  REDIS_TIMEOUT: "5000"
  REDIS_POOL_MAX_ACTIVE: "20"
  REDIS_POOL_MAX_IDLE: "10"
  REDIS_POOL_MIN_IDLE: "2"
  REDIS_POOL_MAX_WAIT: "5000"
  
  # Cache Configuration
  CACHE_ENABLED: "true"
  CACHE_TTL_USER_PROFILE: "3600"
  CACHE_TTL_PERMISSIONS: "7200"
  CACHE_TTL_ROLES: "7200"
  CACHE_PREFIX: "user_service"
  CACHE_NULL_VALUES: "false"
  CACHE_REDIS_SERIALIZER: "json"
  
  # Security Configuration
  JWT_ISSUER: "parking-system"
  JWT_AUDIENCE: "user-service"
  JWT_EXPIRY: "3600"
  JWT_REFRESH_EXPIRY: "604800"
  BCRYPT_ROUNDS: "12"
  PASSWORD_POLICY_ENABLED: "true"
  PASSWORD_MIN_LENGTH: "12"
  PASSWORD_REQUIRE_UPPERCASE: "true"
  PASSWORD_REQUIRE_LOWERCASE: "true"
  PASSWORD_REQUIRE_NUMBERS: "true"
  PASSWORD_REQUIRE_SPECIAL: "true"
  PASSWORD_MAX_AGE_DAYS: "90"
  PASSWORD_HISTORY_COUNT: "5"
  ACCOUNT_LOCKOUT_THRESHOLD: "5"
  ACCOUNT_LOCKOUT_DURATION: "1800"
  MFA_ENABLED: "true"
  MFA_ISSUER: "ParkingSystem"
  
  # Session Management
  SESSION_TIMEOUT: "3600"
  SESSION_MAX_CONCURRENT: "3"
  REMEMBER_ME_ENABLED: "true"
  REMEMBER_ME_TOKEN_VALIDITY: "2592000"
  LOGIN_ATTEMPT_CACHE_TTL: "900"
  
  # User Profile Configuration
  MAX_USER_PROFILE_PICTURE_SIZE: "5242880"
  ALLOWED_PROFILE_PICTURE_TYPES: "image/jpeg,image/png,image/webp"
  DEFAULT_USER_ROLE: "driver"
  USERNAME_PATTERN: "^[a-zA-Z0-9_.-]{3,50}$"
  EMAIL_VERIFICATION_REQUIRED: "true"
  PHONE_VERIFICATION_REQUIRED: "false"
  VERIFICATION_CODE_EXPIRY: "600"
  VERIFICATION_MAX_ATTEMPTS: "3"
  
  # User Data Management
  USER_DATA_RETENTION_DAYS: "730"
  INACTIVE_USER_GRACE_DAYS: "180"
  SOFT_DELETE_ENABLED: "true"
  AUDIT_LOG_ENABLED: "true"
  AUDIT_LOG_RETENTION_DAYS: "365"
  
  # Role & Permission Configuration
  RBAC_ENABLED: "true"
  DYNAMIC_PERMISSIONS: "true"
  PERMISSION_CACHE_ENABLED: "true"
  ROLE_HIERARCHY_ENABLED: "true"
  DEFAULT_PERMISSIONS: "user:read,user:write,profile:read"
  
  # OAuth2 Configuration
  OAUTH2_ENABLED: "true"
  OAUTH2_PROVIDERS: "google,facebook,github"
  OAUTH2_REDIRECT_URI: "https://api.parking-system.com/login/oauth2/code"
  SOCIAL_LOGIN_ENABLED: "true"
  
  # Messaging Configuration
  RABBITMQ_HOST: "rabbitmq.parking-system.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "/"
  RABBITMQ_USER_EVENTS_EXCHANGE: "user.events"
  RABBITMQ_USER_CREATED_QUEUE: "user.created"
  RABBITMQ_USER_UPDATED_QUEUE: "user.updated"
  RABBITMQ_USER_DELETED_QUEUE: "user.deleted"
  RABBITMQ_PASSWORD_RESET_QUEUE: "user.password.reset"
  
  # Monitoring
  METRICS_ENABLED: "true"
  METRICS_PATH: "/actuator/metrics"
  HEALTH_PATH: "/actuator/health"
  INFO_PATH: "/actuator/info"
  TRACING_ENABLED: "true"
  TRACING_SAMPLE_RATE: "0.1"
  
  # Logging
  LOG_LEVEL: "INFO"
  LOG_PARKING_USER_SERVICE: "DEBUG"
  LOG_JSON_FORMAT: "true"
  LOG_INCLUDE_TRACE_ID: "true"
  LOG_MAX_HISTORY: "30"
  LOG_TOTAL_SIZE_CAP: "2GB"
  
  # Feature Flags
  FEATURE_BIOMETRIC_AUTH: "false"
  FEATURE_FACE_RECOGNITION: "false"
  FEATURE_VOICE_AUTH: "false"
  FEATURE_USER_IMPERSONATION: "false"
  FEATURE_USER_MERGING: "true"
  FEATURE_BULK_USER_OPERATIONS: "true"
  FEATURE_USER_EXPORT: "true"
  FEATURE_SSO: "true"
  FEATURE_SCIM: "false"
---
