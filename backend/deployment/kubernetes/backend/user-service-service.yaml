    - protocol: TCP
      port: 465
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: user-service-db-migrations
  namespace: parking-system
  labels:
    app: user-service
    component: migrations
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: migrations
            image: parking-management/user-service:1.0.0
            command:
            - /bin/sh
            - -c
            - |
              java -jar /app/user-service.jar --spring.profiles.active=migration
            envFrom:
            - configMapRef:
                name: user-service-config
            - secretRef:
                name: user-service-secret
            env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            resources:
              requests:
                memory: "256Mi"
                cpu: "200m"
              limits:
                memory: "512Mi"
                cpu: "400m"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: user-service-cleanup
  namespace: parking-system
  labels:
    app: user-service
    component: cleanup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
