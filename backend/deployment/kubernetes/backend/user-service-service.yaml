apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: parking-system
  labels:
    app: user-service
    component: backend
    tier: microservice
    service-type: user-management
    version: "1.0.0"
    managed-by: kubectl
  annotations:
    description: "User management microservice for parking system"
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
    reloader.stakater.com/match: "true"
    sidecar.jaegertracing.io/inject: "true"
    fluentbit.io/parser: "json"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: user-service
      tier: microservice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: user-service
        component: backend
        tier: microservice
        service-type: user-management
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
        checksum/config: {{ include (print $.Template.BasePath "/user-service-config.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/user-service-secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: user-service-sa
      containers:
      - name: user-service
        image: parking-management/user-service:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: management
        - containerPort: 8082
          name: grpc
        - containerPort: 9779
          name: prometheus
        - containerPort: 8778
          name: jolokia
        - containerPort: 9779
          name: metrics
        envFrom:
        - configMapRef:
            name: user-service-config
        - secretRef:
            name: user-service-secret
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /var/log/user-service
        - name: dumps
          mountPath: /dumps
        - name: config
          mountPath: /config
        - name: timezone
          mountPath: /etc/localtime
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 45
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
          successThreshold: 1
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 20
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                curl -X POST http://localhost:8081/actuator/shutdown
                sleep 20
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
      
      - name: fluentbit
        image: fluent/fluent-bit:2.1
        volumeMounts:
        - name: logs
          mountPath: /var/log/user-service
          readOnly: true
        - name: fluentbit-config
          mountPath: /fluent-bit/etc/
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
      
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: dumps
        emptyDir: {}
      - name: config
        configMap:
          name: user-service-config
          defaultMode: 0644
      - name: fluentbit-config
        configMap:
          name: fluentbit-config
          defaultMode: 0644
      - name: timezone
        hostPath:
          path: /usr/share/zoneinfo/UTC
          type: File
      
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - user-service
            topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - user-service
              topologyKey: topology.kubernetes.io/zone
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - pgpool
              topologyKey: kubernetes.io/hostname
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - redis-master
              topologyKey: kubernetes.io/hostname
      
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: user-service
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: user-service
      
      nodeSelector:
        workload-type: microservice
      
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "microservice"
        effect: "NoSchedule"
      
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: parking-system
  labels:
    app: user-service
    component: backend
    tier: microservice
    service-type: user-management
    version: "1.0.0"
    managed-by: kubectl
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
    description: "User management microservice"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  selector:
    app: user-service
    tier: microservice
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: management
    port: 8081
    targetPort: 8081
    protocol: TCP
  - name: grpc
    port: 50052
    targetPort: 8082
    protocol: TCP
  - name: metrics
    port: 9779
    targetPort: 9779
    protocol: TCP
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: Service
metadata:
  name: user-service-headless
  namespace: parking-system
  labels:
    app: user-service
    component: backend
    tier: microservice
    service-type: user-management
  annotations:
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"
spec:
  selector:
    app: user-service
    tier: microservice
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: grpc
    port: 8082
    targetPort: 8082
  clusterIP: None
  publishNotReadyAddresses: true
---
apiVersion: v1
kind: Service
metadata:
  name: user-service-internal
  namespace: parking-system
  labels:
    app: user-service
    component: backend
    tier: microservice
    scope: internal
  annotations:
    description: "Internal service for user management"
spec:
  selector:
    app: user-service
    tier: microservice
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: management
    port: 8081
    targetPort: 8081
  - name: grpc
    port: 8082
    targetPort: 8082
  type: ClusterIP
  clusterIP: 10.96.101.100
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service-sa
  namespace: parking-system
  labels:
    app: user-service
    component: backend
    tier: microservice
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::account-id:role/user-service-role"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: user-service
  namespace: parking-system
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
  resourceNames: ["user-service-secret", "postgres-secret", "redis-secret"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: user-service
  namespace: parking-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: user-service
subjects:
- kind: ServiceAccount
  name: user-service-sa
  namespace: parking-system
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-service-hpa
  namespace: parking-system
  labels:
    app: user-service
    component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  minReplicas: 3
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  - type: Pods
    pods:
      metric:
        name: http.server.requests.per.second
      target:
        type: AverageValue
        averageValue: 200
  - type: Pods
    pods:
      metric:
        name: grpc.server.requests.per.second
      target:
        type: AverageValue
        averageValue: 100
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-service-pdb
  namespace: parking-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: user-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentbit-config
  namespace: parking-system
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Log_Level    info
        Parsers_File parsers.conf
    
    [INPUT]
        Name        tail
        Path        /var/log/user-service/*.log
        Parser      json
        Tag         user-service
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On
    
    [OUTPUT]
        Name        stdout
        Match       *
        Format      json_lines
    
    [OUTPUT]
        Name        es
        Match       user-service
        Host        elasticsearch.logging.svc.cluster.local
        Port        9200
        Index       user-service-logs
        Type        _doc
        Generate_ID On
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-service-network-policy
  namespace: parking-system
spec:
  podSelector:
    matchLabels:
      app: user-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: kong
    - podSelector:
        matchLabels:
          app: parking-api
    - podSelector:
        matchLabels:
          app: booking-service
    - podSelector:
        matchLabels:
          app: payment-service
    - namespaceSelector:
        matchLabels:
          name: parking-monitoring
      podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 8082
    - protocol: TCP
      port: 9779
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: pgpool
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: rabbitmq
    ports:
    - protocol: TCP
      port: 5672
    - protocol: TCP
      port: 15672
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
