    component: database
spec:
  type: ExternalName
  externalName: pgpool.parking-system.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: user-service-cache
  namespace: parking-system
  labels:
    app: user-service
    component: cache
spec:
  type: ExternalName
  externalName: redis-master-service.parking-system.svc.cluster.local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-nginx-config
  namespace: parking-system
data:
  user-service.conf: |
    server {
        listen 80;
        server_name user-service.parking-system.local;
        
        location / {
            proxy_pass http://user-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60;
            proxy_send_timeout 60;
            proxy_read_timeout 60;
            
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            proxy_temp_file_write_size 8k;
        }
        
        location /actuator {
            proxy_pass http://user-service:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Restrict access to internal network only
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }