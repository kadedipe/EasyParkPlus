# PostgreSQL Host-Based Authentication
# Parking Management System - Production Configuration

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local connections (socket)
local   all             postgres                                peer
local   all             all                                     scram-sha-256

# Replication connections
local   replication     all                                     peer
host    replication     all             127.0.0.1/32            scram-sha-256
host    replication     all             ::1/128                 scram-sha-256

# Application connections from Docker network
host    parking_db      parking_user    172.16.0.0/12           scram-sha-256
host    parking_db      parking_user    192.168.0.0/16          scram-sha-256
host    parking_db      parking_user    10.0.0.0/8              scram-sha-256

# Monitoring connections (for pgMonitor, etc.)
host    parking_db      monitoring_user 172.16.0.0/12           scram-sha-256

# Backup connections
host    all             backup_user     172.16.0.0/12           scram-sha-256

# Deny all other connections
host    all             all             all                     reject