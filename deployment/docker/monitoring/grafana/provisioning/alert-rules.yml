apiVersion: 1

groups:
  # Parking System Alerts
  - name: Parking System
    interval: 1m
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5..",job=~"parking-api|payment-service|notification-service"}[5m]))
          / sum(rate(http_requests_total{job=~"parking-api|payment-service|notification-service"}[5m]))
          * 100 > 5
        for: 5m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }}% for more than 5 minutes"
          runbook_url: "https://wiki.example.com/alerts/high-error-rate"
      
      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=~"parking-api|payment-service|notification-service"}[5m])) by (le, job))
          > 2
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }}s for more than 5 minutes"
      
      - alert: LowAvailableSpaces
        expr: |
          parking_spaces_available < 10
        for: 2m
        labels:
          severity: warning
          service: parking
        annotations:
          summary: "Low available parking spaces"
          description: "Only {{ $value }} parking spaces available"
      
      - alert: NoAvailableSpaces
        expr: |
          parking_spaces_available == 0
        for: 2m
        labels:
          severity: critical
          service: parking
        annotations:
          summary: "No available parking spaces"
          description: "All parking spaces are occupied"
  
  # Database Alerts
  - name: Database
    interval: 1m
    rules:
      - alert: HighDatabaseConnections
        expr: |
          pg_stat_database_numbackends{datname="parking_db"} > 100
        for: 2m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "High number of database connections"
          description: "{{ $value }} active connections to parking_db"
      
      - alert: LowCacheHitRatio
        expr: |
          100.0 * pg_stat_database_blks_hit{datname="parking_db"}
          / (pg_stat_database_blks_hit{datname="parking_db"} + pg_stat_database_blks_read{datname="parking_db"})
          < 90
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "Low database cache hit ratio"
          description: "Cache hit ratio is {{ $value }}%"
      
      - alert: HighDeadTuples
        expr: |
          pg_stat_user_tables_n_dead_tup > 10000
        for: 10m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "High number of dead tuples"
          description: "Table has {{ $value }} dead tuples"
  
  # Redis Alerts
  - name: Redis
    interval: 1m
    rules:
      - alert: HighRedisMemoryUsage
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "High Redis memory usage"
          description: "Redis memory usage is {{ $value }}%"
      
      - alert: LowRedisHitRate
        expr: |
          redis_keyspace_hits_total
          / (redis_keyspace_hits_total + redis_keyspace_misses_total)
          * 100 < 80
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Low Redis cache hit rate"
          description: "Redis cache hit rate is {{ $value }}%"
      
      - alert: RedisDown
        expr: |
          up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis is down"
          description: "Redis instance is not responding"
  
  # Infrastructure Alerts
  - name: Infrastructure
    interval: 1m
    rules:
      - alert: HighCPUUsage
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}%"
      
      - alert: HighMemoryUsage
        expr: |
          (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
          / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}%"
      
      - alert: LowDiskSpace
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs"} * 100) < 15
        for: 5m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "Low disk space"
          description: "Disk space is only {{ $value }}% available"

  # Parking API Specific Alerts
  - name: Parking API
    interval: 1m
    rules:
      - alert: ParkingAPIHighErrorRate
        expr: |
          sum(rate(parking_api_http_requests_total{status=~"5.."}[5m]))
          / sum(rate(parking_api_http_requests_total[5m]))
          * 100 > 5
        for: 5m
        labels:
          severity: critical
          service: parking-api
        annotations:
          summary: "High error rate in Parking API"
          description: "Parking API error rate is {{ $value }}% for more than 5 minutes"
          runbook_url: "https://wiki.example.com/alerts/parking-api-high-error-rate"
      
      - alert: ParkingAPIHighResponseTime
        expr: |
          histogram_quantile(0.95, sum(rate(parking_api_http_request_duration_seconds_bucket[5m])) by (le))
          > 2
        for: 5m
        labels:
          severity: warning
          service: parking-api
        annotations:
          summary: "High response time in Parking API"
          description: "Parking API 95th percentile response time is {{ $value }}s"
      
      - alert: ParkingAPILowAvailableSpaces
        expr: |
          parking_api_spaces_available < 10
        for: 2m
        labels:
          severity: warning
          service: parking-api
        annotations:
          summary: "Low available parking spaces"
          description: "Only {{ $value }} parking spaces available across all lots"
      
      - alert: ParkingAPIDatabaseSlowQueries
        expr: |
          histogram_quantile(0.95, sum(rate(parking_api_database_query_duration_seconds_bucket[5m])) by (le))
          > 1
        for: 5m
        labels:
          severity: warning
          service: parking-api
        annotations:
          summary: "Slow database queries in Parking API"
          description: "Database queries are slow (95th percentile: {{ $value }}s)"
      
      - alert: ParkingAPICacheLowHitRate
        expr: |
          sum(rate(parking_api_cache_hits_total[5m]))
          / (sum(rate(parking_api_cache_hits_total[5m])) + sum(rate(parking_api_cache_misses_total[5m])))
          * 100 < 80
        for: 10m
        labels:
          severity: warning
          service: parking-api
        annotations:
          summary: "Low cache hit rate in Parking API"
          description: "Cache hit rate is {{ $value }}%"
      
      - alert: ParkingAPIAuthFailures
        expr: |
          rate(parking_api_auth_failure_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
          service: parking-api
        annotations:
          summary: "High authentication failure rate"
          description: "Authentication failures are occurring at {{ $value }} per second"
      
      - alert: ParkingAPIDown
        expr: |
          up{job="parking-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: parking-api
        annotations:
          summary: "Parking API is down"
          description: "Parking API service is not responding"

  # Payment Service Alerts
  - name: Payment Service
    interval: 1m
    rules:
      - alert: PaymentServiceHighFailureRate
        expr: |
          sum(rate(payment_service_transactions_total{status=~"failed|error"}[5m]))
          / sum(rate(payment_service_transactions_total[5m]))
          * 100 > 5
        for: 5m
        labels:
          severity: critical
          service: payment-service
        annotations:
          summary: "High payment failure rate"
          description: "Payment failure rate is {{ $value }}% for more than 5 minutes"
          runbook_url: "https://wiki.example.com/alerts/payment-failure-rate"
      
      - alert: PaymentServiceLowSuccessRate
        expr: |
          sum(rate(payment_service_transactions_total{status="success"}[5m]))
          / sum(rate(payment_service_transactions_total[5m]))
          * 100 < 95
        for: 10m
        labels:
          severity: warning
          service: payment-service
        annotations:
          summary: "Low payment success rate"
          description: "Payment success rate is {{ $value }}% for more than 10 minutes"
      
      - alert: PaymentServiceHighProcessingTime
        expr: |
          histogram_quantile(0.95, sum(rate(payment_service_transaction_duration_seconds_bucket[5m])) by (le))
          > 3
        for: 5m
        labels:
          severity: warning
          service: payment-service
        annotations:
          summary: "High payment processing time"
          description: "Payment processing time (p95) is {{ $value }}s"
      
      - alert: PaymentServiceGatewayErrorRate
        expr: |
          sum(rate(payment_service_gateway_errors_total[5m]))
          / sum(rate(payment_service_gateway_calls_total[5m]))
          * 100 > 10
        for: 5m
        labels:
          severity: warning
          service: payment-service
        annotations:
          summary: "High payment gateway error rate"
          description: "Payment gateway error rate is {{ $value }}%"
      
      - alert: PaymentServiceHighRefundRate
        expr: |
          sum(rate(payment_service_refunds_total[5m]))
          / sum(rate(payment_service_transactions_total{status="success"}[5m]))
          * 100 > 5
        for: 30m
        labels:
          severity: warning
          service: payment-service
        annotations:
          summary: "High refund rate"
          description: "Refund rate is {{ $value }}% for more than 30 minutes"
      
      - alert: PaymentServiceDown
        expr: |
          up{job="payment-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: payment-service
        annotations:
          summary: "Payment Service is down"
          description: "Payment service is not responding"

  # Notification Service Alerts
  - name: Notification Service
    interval: 1m
    rules:
      - alert: NotificationServiceHighFailureRate
        expr: |
          sum(rate(notification_service_notifications_sent_total{status=~"failed|error"}[5m]))
          / sum(rate(notification_service_notifications_sent_total[5m]))
          * 100 > 10
        for: 5m
        labels:
          severity: critical
          service: notification-service
        annotations:
          summary: "High notification failure rate"
          description: "Notification failure rate is {{ $value }}% for more than 5 minutes"
          runbook_url: "https://wiki.example.com/alerts/notification-failure-rate"
      
      - alert: NotificationServiceLowDeliveryRate
        expr: |
          sum(rate(notification_service_notifications_sent_total{status="delivered"}[5m]))
          / sum(rate(notification_service_notifications_sent_total[5m]))
          * 100 < 90
        for: 10m
        labels:
          severity: warning
          service: notification-service
        annotations:
          summary: "Low notification delivery rate"
          description: "Notification delivery rate is {{ $value }}% for more than 10 minutes"
      
      - alert: NotificationServiceHighQueueSize
        expr: |
          notification_service_queue_size > 5000
        for: 5m
        labels:
          severity: warning
          service: notification-service
        annotations:
          summary: "High notification queue size"
          description: "Notification queue size is {{ $value }}"
      
      - alert: NotificationServiceHighDeliveryLatency
        expr: |
          histogram_quantile(0.95, sum(rate(notification_service_delivery_latency_seconds_bucket[5m])) by (le))
          > 30
        for: 5m
        labels:
          severity: warning
          service: notification-service
        annotations:
          summary: "High notification delivery latency"
          description: "Notification delivery latency (p95) is {{ $value }}s"
      
      - alert: NotificationServiceProviderErrorRate
        expr: |
          sum(rate(notification_service_provider_errors_total[5m]))
          / sum(rate(notification_service_provider_calls_total[5m]))
          * 100 > 20
        for: 5m
        labels:
          severity: warning
          service: notification-service
        annotations:
          summary: "High notification provider error rate"
          description: "Notification provider error rate is {{ $value }}%"
      
      - alert: NotificationServiceDown
        expr: |
          up{job="notification-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: notification-service
        annotations:
          summary: "Notification Service is down"
          description: "Notification service is not responding"
