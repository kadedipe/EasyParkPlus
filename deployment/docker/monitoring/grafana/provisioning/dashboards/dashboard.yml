apiVersion: 1

providers:
  # Parking Management System Dashboards
  - name: 'Parking System Dashboards'
    orgId: 1
    folder: 'Parking Management'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true

  # PostgreSQL Database Dashboards
  - name: 'PostgreSQL Dashboards'
    orgId: 1
    folder: 'Databases'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/databases

  # Redis Cache Dashboards
  - name: 'Redis Dashboards'
    orgId: 1
    folder: 'Caching'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/caching

  # API Performance Dashboards
  - name: 'API Dashboards'
    orgId: 1
    folder: 'APIs'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/apis

  # Infrastructure Dashboards
  - name: 'Infrastructure Dashboards'
    orgId: 1
    folder: 'Infrastructure'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/infrastructure
