version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # PostgreSQL Database Cluster
  postgres-primary:
    image: postgres:15-alpine
    container_name: postgres-primary
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parking_db}
      POSTGRES_USER: ${POSTGRES_USER:-parking_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parking_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./postgres/backup.sh:/backup.sh
    ports:
      - "5432:5432"
    networks:
      - parking_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parking_user}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 80s
    logging: *default-logging

  postgres-replica:
    image: postgres:15-alpine
    container_name: postgres-replica
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parking_db}
      POSTGRES_USER: ${POSTGRES_USER:-parking_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parking_password}
      REPLICATION_USER: ${REPLICATION_USER:-replica_user}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replica_password}
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    command: >
      bash -c "
      echo 'Setting up replication...' &&
      until pg_basebackup -h postgres-primary -U ${REPLICATION_USER:-replica_user} -D /var/lib/postgresql/data -P -R -X stream -C -S replica_slot; do
        echo 'Waiting for primary to be ready...'
        sleep 5
      done &&
      echo 'Replication setup complete' &&
      docker-entrypoint.sh postgres
      "
    ports:
      - "5433:5432"
    networks:
      - parking_network
    logging: *default-logging

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    networks:
      - parking_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # API Gateway (NGINX)
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-gateway
    restart: unless-stopped
    depends_on:
      parking-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - parking_network
    logging: *default-logging

  # Application Services
  parking-api:
    build:
      context: ../../parking-api
      dockerfile: Dockerfile
    container_name: parking-api
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-parking_user}:${POSTGRES_PASSWORD:-parking_password}@postgres-primary:5432/${POSTGRES_DB:-parking_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_here_change_in_production}
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ./../../parking-api:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - parking_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging

  payment-service:
    build:
      context: ../../payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-parking_user}:${POSTGRES_PASSWORD:-parking_password}@postgres-primary:5432/${POSTGRES_DB:-parking_db}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "3001:3000"
    networks:
      - parking_network
    logging: *default-logging

  notification-service:
    build:
      context: ../../notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    restart: unless-stopped
    environment:
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      REDIS_URL: redis://redis:6379
    ports:
      - "3002:3000"
    networks:
      - parking_network
    logging: *default-logging

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - parking_network
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3003:3000"
    networks:
      - parking_network
    logging: *default-logging

  # ELK Stack (Optional)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - parking_network
    logging: *default-logging

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.0
    container_name: kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    networks:
      - parking_network
    logging: *default-logging

networks:
  parking_network:
    driver: bridge

volumes:
  postgres_primary_data:
  postgres_replica_data:
  redis_data:
  nginx_logs:
  prometheus_data:
  grafana_data:
  elasticsearch_data: