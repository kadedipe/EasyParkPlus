apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: parking-system
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  API_VERSION: "v1"
  API_RATE_LIMIT: "100"
  API_RATE_WINDOW: "60"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  
  # Service URLs
  USER_SERVICE_URL: "http://user-service.parking-system:8080"
  PAYMENT_SERVICE_URL: "http://payment-service.parking-system:8080"
  NOTIFICATION_SERVICE_URL: "http://notification-service.parking-system:8080"
  ANALYTICS_SERVICE_URL: "http://analytics-service.parking-system:8080"
  
  # CORS Settings
  CORS_ALLOWED_ORIGINS: "https://parking.example.com"
  CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
  
  # Feature Flags
  ENABLE_PAYMENT_GATEWAY: "true"
  ENABLE_NOTIFICATIONS: "true"
  ENABLE_ANALYTICS: "true"
  ENABLE_CACHE: "true"
  
  # JWT Settings
  JWT_ALGORITHM: "RS256"
  JWT_EXPIRY: "3600"
  
  # Parking Business Rules
  PARKING_MAX_DURATION_HOURS: "24"
  PARKING_GRACE_PERIOD_MINUTES: "15"
  PARKING_CANCEL_WINDOW_MINUTES: "5"
  PARKING_RATE_PER_HOUR: "2.50"
  PARKING_DAILY_MAX_RATE: "20.00"
  
  # Cache Settings
  CACHE_TTL_SECONDS: "300"
  SPOT_AVAILABILITY_CACHE_TTL: "30"
  USER_SESSION_CACHE_TTL: "3600"
  
  # Monitoring
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"
  TRACING_ENABLED: "true"
  TRACING_SAMPLE_RATE: "0.1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: parking-monitoring
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  METRICS_RETENTION_DAYS: "30"
  ALERT_RETENTION_DAYS: "7"