apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: parking-system
data:
  kong.conf: |
    # Kong API Gateway Configuration
    
    # Database
    database = postgres
    pg_host = postgres-service.parking-system
    pg_port = 5432
    pg_user = kong
    pg_password = ${KONG_PG_PASSWORD}
    pg_database = kong
    
    # Server
    proxy_listen = 0.0.0.0:8000
    admin_listen = 0.0.0.0:8001
    status_listen = 0.0.0.0:8100
    
    # SSL
    proxy_listen_ssl = 0.0.0.0:8443
    admin_listen_ssl = 0.0.0.0:8444
    ssl_cert = /etc/kong/ssl/tls.crt
    ssl_cert_key = /etc/kong/ssl/tls.key
    
    # Nginx
    nginx_worker_processes = auto
    nginx_http_keepalive_requests = 1000
    nginx_http_keepalive_timeout = 60s
    nginx_proxy_connect_timeout = 60s
    nginx_proxy_send_timeout = 60s
    nginx_proxy_read_timeout = 60s
    
    # Plugins
    plugins = bundled,rate-limiting,jwt,acl,cors,proxy-cache,prometheus,request-transformer,response-transformer
    
    # Proxy Cache
    proxy_cache_enabled = on
    proxy_cache_ttl = 300
    
    # Rate Limiting
    rate_limiting_policy = local
    rate_limiting_year = 0
    
    # Prometheus
    prometheus_enabled = on
    prometheus_port = 9540
    
    # Logging
    proxy_access_log = /dev/stdout
    proxy_error_log = /dev/stderr
    log_level = notice
    
    # Memory
    mem_cache_size = 128m
    
    # DNS
    dns_resolver = kube-dns.kube-system.svc.cluster.local:53
    dns_hostsfile = /etc/hosts
    
    # Cluster
    cluster_listen = 0.0.0.0:8005
    cluster_cert = /etc/kong/ssl/cluster.crt
    cluster_cert_key = /etc/kong/ssl/cluster.key
    cluster_control_plane = 127.0.0.1:8005
    cluster_telemetry_endpoint = 127.0.0.1:8006
    cluster_telemetry_listen = 0.0.0.0:8006
    
    # Upstream
    upstream_keepalive = 60
    upstream_keepalive_pool_size = 60
    upstream_keepalive_max_requests = 1000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-init-scripts
  namespace: parking-system
data:
  init.sh: |
    #!/bin/bash
    set -e
    
    echo "Waiting for Kong to be ready..."
    until kong health; do
      echo "Waiting for Kong..."
      sleep 5
    done
    
    echo "Configuring Kong..."
    
    # Create services
    curl -s -X POST http://localhost:8001/services \
      -H "Content-Type: application/json" \
      -d '{
        "name": "parking-api",
        "url": "http://parking-api-service.parking-system:8080"
      }'
    
    curl -s -X POST http://localhost:8001/services \
      -H "Content-Type: application/json" \
      -d '{
        "name": "user-service",
        "url": "http://user-service.parking-system:8080"
      }'
    
    curl -s -X POST http://localhost:8001/services \
      -H "Content-Type: application/json" \
      -d '{
        "name": "payment-service",
        "url": "http://payment-service.parking-system:8080"
      }'
    
    curl -s -X POST http://localhost:8001/services \
      -H "Content-Type: application/json" \
      -d '{
        "name": "notification-service",
        "url": "http://notification-service.parking-system:8080"
      }'
    
    # Create routes
    curl -s -X POST http://localhost:8001/services/parking-api/routes \
      -H "Content-Type: application/json" \
      -d '{
        "name": "parking-api-route",
        "paths": ["/api/v1/parking"],
        "methods": ["GET", "POST", "PUT", "DELETE"],
        "strip_path": false
      }'
    
    curl -s -X POST http://localhost:8001/services/user-service/routes \
      -H "Content-Type: application/json" \
      -d '{
        "name": "user-service-route",
        "paths": ["/api/v1/users"],
        "methods": ["GET", "POST", "PUT"],
        "strip_path": false
      }'
    
    curl -s -X POST http://localhost:8001/services/payment-service/routes \
      -H "Content-Type: application/json" \
      -d '{
        "name": "payment-service-route",
        "paths": ["/api/v1/payments"],
        "methods": ["GET", "POST"],
        "strip_path": false
      }'
    
    curl -s -X POST http://localhost:8001/services/notification-service/routes \
      -H "Content-Type: application/json" \
      -d '{
        "name": "notification-service-route",
        "paths": ["/api/v1/notifications"],
        "methods": ["POST"],
        "strip_path": false
      }'
    
    # Enable plugins
    for service in parking-api user-service payment-service notification-service; do
      # Rate limiting
      curl -s -X POST http://localhost:8001/services/$service/plugins \
        -H "Content-Type: application/json" \
        -d '{
          "name": "rate-limiting",
          "config": {
            "minute": 100,
            "hour": 1000,
            "policy": "local"
          }
        }'
      
      # CORS
      curl -s -X POST http://localhost:8001/services/$service/plugins \
        -H "Content-Type: application/json" \
        -d '{
          "name": "cors",
          "config": {
            "origins": ["https://parking.example.com"],
            "methods": ["GET", "POST", "PUT", "DELETE", "OPTIONS"],
            "headers": ["Content-Type", "Authorization"],
            "exposed_headers": ["X-RateLimit-Limit", "X-RateLimit-Remaining"],
            "credentials": true,
            "max_age": 3600,
            "preflight_continue": false
          }
        }'
      
      # Prometheus metrics
      curl -s -X POST http://localhost:8001/services/$service/plugins \
        -H "Content-Type: application/json" \
        -d '{
          "name": "prometheus"
        }'
    done
    
    # Enable JWT auth for protected services
    for service in payment-service user-service; do
      curl -s -X POST http://localhost:8001/services/$service/plugins \
        -H "Content-Type: application/json" \
        -d '{
          "name": "jwt",
          "config": {
            "claims_to_verify": ["exp", "nbf"],
            "key_claim_name": "iss",
            "secret_is_base64": false,
            "run_on_preflight": true,
            "maximum_expiration": 3600
          }
        }'
    done
    
    # Enable proxy cache for read-heavy endpoints
    curl -s -X POST http://localhost:8001/services/parking-api/plugins \
      -H "Content-Type: application/json" \
      -d '{
        "name": "proxy-cache",
        "config": {
          "response_code": [200, 301, 404],
          "request_method": ["GET", "HEAD"],
          "content_type": ["application/json"],
          "cache_ttl": 300,
          "strategy": "memory"
        }
      }'
    
    echo "Kong configuration completed!"