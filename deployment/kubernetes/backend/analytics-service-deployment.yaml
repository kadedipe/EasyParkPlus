apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: parking-system
  labels:
    app: analytics-service
    component: backend
    service: analytics
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: analytics-service
        component: backend
        service: analytics
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: analytics-service
        image: parking-management/analytics-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8082
          name: metrics
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: analytics-data
          mountPath: /data
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 1000
          runAsNonRoot: true
          readOnlyRootFilesystem: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: analytics-data
        persistentVolumeClaim:
          claimName: analytics-data-pvc
      serviceAccountName: analytics-service-sa
      nodeSelector:
        workload-type: analytics
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: parking-system
  labels:
    app: analytics-service
    component: backend
spec:
  selector:
    app: analytics-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: metrics
    port: 8082
    targetPort: 8082
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-service-sa
  namespace: parking-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: analytics-data-pvc
  namespace: parking-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard