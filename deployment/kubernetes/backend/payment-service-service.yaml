apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: parking-system
  labels:
    app: payment-service
    component: backend
    tier: microservice
    service-type: payment-processing
    version: "1.0.0"
    managed-by: kubectl
    security-tier: critical
    compliance: pci-dss
  annotations:
    description: "Payment processing microservice for parking system"
    built-with: "nodejs"
    repository: "parking-management/payment-service"
    pci-dss-scope: "in-scope"
    data-classification: "sensitive"
data:
  # Application Configuration
  APP_NAME: "Payment Processing Service"
  APP_ENV: "production"
  APP_PORT: "3000"
  APP_VERSION: "1.0.0"
  APP_TIMEZONE: "UTC"
  API_PREFIX: "/api/v1/payments"
  API_DOCS_PATH: "/api-docs"
  API_DOCS_ENABLED: "false"
  NODE_ENV: "production"
  
  # Service Discovery
  SERVICE_NAME: "payment-service"
  SERVICE_HOST: "payment-service.parking-system.svc.cluster.local"
  SERVICE_PORT: "3000"
  
  # Database Configuration - Primary
  DB_HOST: "pgpool.parking-system.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "payment_db"
  DB_SCHEMA: "payments"
  DB_SSL_MODE: "require"
  DB_MAX_POOL_SIZE: "20"
  DB_MIN_POOL_SIZE: "5"
  DB_IDLE_TIMEOUT: "30000"
  DB_CONNECTION_TIMEOUT: "30000"
  DB_STATEMENT_TIMEOUT: "10000"
  
  # Read Replica Configuration
  DB_READER_HOST: "postgres-reader-service.parking-system.svc.cluster.local"
  DB_READER_PORT: "5432"
  DB_READER_NAME: "payment_db"
  READ_REPLICA_ENABLED: "true"
  
  # Redis Cache Configuration
  REDIS_HOST: "redis-master-service.parking-system.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "8"
  REDIS_CACHE_DB: "9"
  REDIS_TIMEOUT: "3000"
  REDIS_MAX_RETRIES: "3"
  REDIS_RETRY_STRATEGY: "exponential"
  REDIS_POOL_SIZE: "10"
  
  # Cache Configuration
  CACHE_ENABLED: "true"
  CACHE_TTL_PAYMENT_METHODS: "300"
  CACHE_TTL_PRICING: "600"
  CACHE_TTL_INVOICES: "1800"
  CACHE_TTL_TRANSACTIONS: "120"
  CACHE_PREFIX: "payment_service"
  CACHE_NULL_VALUES: "false"
  
  # Payment Processing Configuration
  CURRENCY: "USD"
  CURRENCY_SYMBOL: "$"
  TAX_RATE: "8.5"
  MINIMUM_PAYMENT_AMOUNT: "0.50"
  MAXIMUM_PAYMENT_AMOUNT: "5000.00"
  PAYMENT_TIMEOUT_SECONDS: "300"
  PAYMENT_CONFIRMATION_TIMEOUT: "30"
  PAYMENT_METHODS_ENABLED: "credit_card,debit_card,digital_wallet,bank_transfer,crypto"
  
  # Credit Card Processing
  CARD_PROCESSOR: "stripe"
  CARD_PROCESSING_FEE_PERCENTAGE: "2.9"
  CARD_PROCESSING_FEE_FIXED: "0.30"
  CARD_VERIFICATION_ENABLED: "true"
  CARD_AVS_VERIFICATION: "true"
  CARD_CVV_VERIFICATION: "true"
  CARD_3DS_ENABLED: "true"
  CARD_3DS_TIMEOUT: "180"
  CARD_TOKENIZATION_ENABLED: "true"
  
  # Digital Wallet Configuration
  DIGITAL_WALLET_ENABLED: "true"
  DIGITAL_WALLET_PROVIDERS: "apple_pay,google_pay,paypal"
  APPLE_PAY_MERCHANT_ID: "merchant.parking.system"
  APPLE_PAY_CERTIFICATE_EXPIRY_DAYS: "365"
  GOOGLE_PAY_MERCHANT_ID: "BCR2DN4TXHVKV3V2"
  PAYPAL_PAYMENT_TIMEOUT: "180"
  
  # Bank Transfer Configuration
  BANK_TRANSFER_ENABLED: "true"
  BANK_TRANSFER_PROCESSING_DAYS: "3"
  BANK_TRANSFER_VERIFICATION_REQUIRED: "true"
  ACH_PROCESSING_ENABLED: "true"
  ACH_SETTLEMENT_DAYS: "3"
  WIRE_TRANSFER_MIN_AMOUNT: "1000.00"
  
  # Cryptocurrency Configuration
  CRYPTO_ENABLED: "false"
  CRYPTO_PROVIDER: "coinbase"
  CRYPTO_CURRENCIES: "BTC,ETH,USDC"
  CRYPTO_CONFIRMATIONS_REQUIRED: "3"
  CRYPTO_PRICE_VOLATILITY_BUFFER: "5"
  
  # Subscription & Recurring Billing
  RECURRING_BILLING_ENABLED: "true"
  RECURRING_PROCESSING_HOUR: "3"
  RECURRING_RETRY_COUNT: "3"
  RECURRING_RETRY_DELAY_HOURS: "24"
  SUBSCRIPTION_GRACE_PERIOD_DAYS: "7"
  SUBSCRIPTION_CANCELLATION_REFUND_DAYS: "3"
  
  # Invoicing
  INVOICE_AUTO_GENERATE: "true"
  INVOICE_DUE_DAYS: "30"
  INVOICE_LATE_FEE_PERCENTAGE: "1.5"
  INVOICE_LATE_FEE_DAYS: "15"
  INVOICE_PREFIX: "INV"
  INVOICE_NUMBER_PATTERN: "INV-{YYYY}-{MM}-{SEQUENCE}"
  INVOICE_PDF_ENABLED: "true"
  INVOICE_EMAIL_ENABLED: "true"
  
  # Refund Processing
  REFUND_AUTO_APPROVE_DAYS: "7"
  REFUND_MAX_AMOUNT_PERCENTAGE: "100"
  REFUND_PROCESSING_DAYS: "5"
  REFUND_REASON_REQUIRED: "true"
  PARTIAL_REFUND_ENABLED: "true"
  
  # Dispute Management
  DISPUTE_AUTO_RESPOND: "true"
  DISPUTE_RESPONSE_DAYS: "7"
  DISPUTE_EVIDENCE_REQUIRED: "true"
  DISPUTE_NOTIFICATION_ENABLED: "true"
  CHARGEBACK_HANDLING_ENABLED: "true"
  
  # Payout Processing
  PAYOUT_PROCESSING_ENABLED: "true"
  PAYOUT_SCHEDULE: "daily"
  PAYOUT_MINIMUM_AMOUNT: "10.00"
  PAYOUT_PROCESSING_DAYS: "2"
  PAYOUT_METHODS: "bank_account,paypal"
  PAYOUT_AUTO_TRANSFER: "true"
  
  # Tax Configuration
  TAX_CALCULATION_ENABLED: "true"
  TAX_INCLUSIVE_PRICING: "false"
  TAX_AUTO_COLLECT: "true"
  TAX_REPORTING_ENABLED: "true"
  VAT_ENABLED: "true"
  VAT_NUMBER_VALIDATION: "true"
  GST_ENABLED: "true"
  
  # Fraud Prevention
  FRAUD_DETECTION_ENABLED: "true"
  FRAUD_SCORE_THRESHOLD: "75"
  FRAUD_VELOCITY_CHECK_ENABLED: "true"
  FRAUD_VELOCITY_LIMIT: "10"
  FRAUD_VELOCITY_WINDOW: "300"
  FRAUD_IP_CHECK_ENABLED: "true"
  FRAUD_DEVICE_FINGERPRINTING: "true"
  SUSPICIOUS_AMOUNT_THRESHOLD: "1000.00"
  SUSPICIOUS_FREQUENCY_THRESHOLD: "5"
  SUSPICIOUS_FREQUENCY_WINDOW: "3600"
  
  # Reconciliation
  RECONCILIATION_ENABLED: "true"
  RECONCILIATION_SCHEDULE: "0 */6 * * *"
  RECONCILIATION_TOLERANCE: "0.01"
  RECONCILIATION_REPORT_ENABLED: "true"
  AUTO_RECONCILE: "true"
  
  # Messaging Configuration
  RABBITMQ_HOST: "rabbitmq.parking-system.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "/"
  RABBITMQ_PAYMENT_EVENTS_EXCHANGE: "payment.events"
  RABBITMQ_PAYMENT_CREATED_QUEUE: "payment.created"
  RABBITMQ_PAYMENT_PROCESSED_QUEUE: "payment.processed"
  RABBITMQ_PAYMENT_FAILED_QUEUE: "payment.failed"
  RABBITMQ_PAYMENT_REFUNDED_QUEUE: "payment.refunded"
  RABBITMQ_INVOICE_GENERATED_QUEUE: "invoice.generated"
  
  # Monitoring
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"
  HEALTH_PATH: "/health"
  READINESS_PATH: "/ready"
  LIVENESS_PATH: "/alive"
  TRACING_ENABLED: "true"
  TRACING_SAMPLE_RATE: "0.25"
  PROFILER_ENABLED: "false"
  
  # Logging
  LOG_LEVEL: "info"
  LOG_PAYMENT_SERVICE: "debug"
  LOG_JSON_FORMAT: "true"
  LOG_INCLUDE_TRACE_ID: "true"
  LOG_MAX_FILES: "30"
  LOG_MAX_FILE_SIZE: "100m"
  LOG_REQUEST_BODY: "false"
  LOG_RESPONSE_BODY: "false"
  SENSITIVE_DATA_MASKING: "true"
  SENSITIVE_FIELDS: "card_number,cvv,password,token,secret"
  
  # Security
  PCI_COMPLIANCE_MODE: "true"
  ENCRYPT_SENSITIVE_DATA: "true"
  TOKENIZE_PAYMENT_DATA: "true"
  MASK_PAN: "true"
  PAN_VISIBLE_LAST_4: "true"
  ENCRYPTION_ALGORITHM: "aes-256-gcm"
  SESSION_TIMEOUT: "900"
  MAX_PAYMENT_ATTEMPTS: "3"
  RATE_LIMIT_REQUESTS: "50"
  RATE_LIMIT_WINDOW: "60"
  
  # Feature Flags
  FEATURE_TEST_MODE: "false"
  FEATURE_SANDBOX_MODE: "false"
  FEATURE_PAYMENT_LINK: "true"
  FEATURE_PAYMENT_REQUEST: "true"
  FEATURE_SPLIT_PAYMENT: "true"
  FEATURE_DEPOSIT_HOLD: "true"
  FEATURE_ESCROW: "false"
  FEATURE_LOYALTY_POINTS: "true"
  FEATURE_CASHBACK: "true"
  FEATURE_DISCOUNTS: "true"
  FEATURE_COUPONS: "true"
  FEATURE_GIFT_CARDS: "true"
---
