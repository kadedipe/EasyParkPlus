apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentbit-config
  namespace: parking-system
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Log_Level    info
        Parsers_File parsers.conf
    
    [INPUT]
        Name        tail
        Path        /var/log/payment-service/*.log
        Parser      json
        Tag         payment-service
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On
    
    [FILTER]
        Name        modify
        Match       payment-service
        Remove      card_number
        Remove      cvv
        Remove      password
        Remove      token
        Remove      secret
    
    [OUTPUT]
        Name        stdout
        Match       *
        Format      json_lines
    
    [OUTPUT]
        Name        es
        Match       payment-service
        Host        elasticsearch.logging.svc.cluster.local
        Port        9200
        Index       payment-service-logs
        Type        _doc
        Generate_ID On
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payment-service-audit-pvc
  namespace: parking-system
  labels:
    app: payment-service
    component: audit
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 20Gi
---
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: payment-service-psp
  namespace: parking-system
  annotations:
    seccomp.security.alpha.kubernetes.io/allowedProfileNames: 'docker/default,runtime/default'
    apparmor.security.beta.kubernetes.io/allowedProfileNames: 'runtime/default'
    seccomp.security.alpha.kubernetes.io/defaultProfileName:  'runtime/default'
    apparmor.security.beta.kubernetes.io/defaultProfileName:  'runtime/default'
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: 'MustRunAsNonRoot'
  runAsGroup:
    rule: 'MustRunAs'
    ranges:
    - min: 1000
      max: 65535
  seLinux:
    rule: 'RunAsAny'
  supplementalGroups:
    rule: 'MustRunAs'
    ranges:
    - min: 1000
      max: 65535
  fsGroup:
    rule: 'MustRunAs'
    ranges:
    - min: 1000
      max: 65535
  readOnlyRootFilesystem: true