apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: parking-system
  labels:
    app: notification-service
    component: backend
    tier: microservice
    service-type: notification-delivery
    version: "1.0.0"
    managed-by: kubectl
    compliance: gdpr
  annotations:
    description: "Notification delivery microservice for parking system"
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
    reloader.stakater.com/match: "true"
    sidecar.jaegertracing.io/inject: "true"
    fluentbit.io/parser: "json"
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "notification-service"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notification-service
      tier: microservice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: notification-service
        component: backend
        tier: microservice
        service-type: notification-delivery
        version: "1.0.0"
        compliance: gdpr
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        checksum/config: {{ include (print $.Template.BasePath "/notification-service-config.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/notification-service-secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: notification-service-sa
      containers:
      - name: notification-service
        image: parking-management/notification-service:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8001
          name: management
        - containerPort: 8002
          name: grpc
        - containerPort: 8003
          name: websocket
        - containerPort: 9090
          name: metrics
        envFrom:
        - configMapRef:
            name: notification-service-config
        - secretRef:
            name: notification-service-secret
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        - name: PYTHONOPTIMIZE
          value: "1"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /var/log/notification-service
        - name: config
          mountPath: /app/config
        - name: templates
          mountPath: /app/templates
        - name: secrets
          mountPath: /app/secrets
          readOnly: true
        - name: timezone
          mountPath: /etc/localtime
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /alive
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        startupProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 24
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                python /app/graceful_shutdown.py
                sleep 10
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
      
      - name: websocket-server
        image: parking-management/notification-websocket:1.0.0
        ports:
        - containerPort: 8004
          name: ws
        env:
        - name: REDIS_HOST
          value: "redis-master-service.parking-system.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        - name: REDIS_DB
          value: "12"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /var/log/websocket
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8004
          initialDelaySeconds: 20
          periodSeconds: 5
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
      
      - name: fluentbit
        image: fluent/fluent-bit:2.1
        volumeMounts:
        - name: logs
          mountPath: /var/log/notification-service
          readOnly: true
        - name: fluentbit-config
          mountPath: /fluent-bit/etc/
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
      
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: config
        configMap:
          name: notification-service-config
          defaultMode: 0644
      - name: templates
        persistentVolumeClaim:
          claimName: notification-templates-pvc
      - name: secrets
        emptyDir:
          medium: Memory
      - name: fluentbit-config
        configMap:
          name: fluentbit-config
          defaultMode: 0644
      - name: timezone
        hostPath:
          path: /usr/share/zoneinfo/UTC
          type: File
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - notification-service
              topologyKey: kubernetes.io/hostname
      
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: notification-service
      
      nodeSelector:
        workload-type: microservice
      
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: parking-system
  labels:
    app: notification-service
    component: backend
    tier: microservice
    service-type: notification-delivery
    version: "1.0.0"
    managed-by: kubectl
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
    description: "Notification delivery microservice"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  selector:
    app: notification-service
    tier: microservice
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: management
    port: 8001
    targetPort: 8001
    protocol: TCP
  - name: grpc
    port: 50054
    targetPort: 8002
    protocol: TCP
  - name: websocket
    port: 8003
    targetPort: 8003
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
