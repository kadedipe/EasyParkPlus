    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentbit-config
  namespace: parking-system
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Log_Level    info
        Parsers_File parsers.conf
    
    [INPUT]
        Name        tail
        Path        /var/log/notification-service/*.log
        Parser      json
        Tag         notification-service
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On
    
    [FILTER]
        Name        modify
        Match       notification-service
        Remove      email_address
        Remove      phone_number
        Remove      device_token
        Remove      api_key
    
    [OUTPUT]
        Name        stdout
        Match       *
        Format      json_lines
    
    [OUTPUT]
        Name        es
        Match       notification-service
        Host        elasticsearch.logging.svc.cluster.local
        Port        9200
        Index       notification-service-logs
        Type        _doc
        Generate_ID On
