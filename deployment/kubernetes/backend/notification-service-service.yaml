apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-email-templates
  namespace: parking-system
data:
  welcome.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <title>Welcome to Parking System</title>
        <style>
            body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
            .container { max-width: 600px; margin: 0 auto; padding: 20px; }
            .header { background-color: #4CAF50; color: white; padding: 20px; text-align: center; }
            .content { padding: 20px; }
            .button { display: inline-block; padding: 10px 20px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 5px; }
            .footer { margin-top: 20px; padding: 20px; font-size: 12px; color: #666; text-align: center; }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>Welcome to Parking System!</h1>
            </div>
            <div class="content">
                <h2>Hello {{ user_name }},</h2>
                <p>Thank you for joining Parking System! We're excited to have you on board.</p>
                <p>With your account, you can:</p>
                <ul>
                    <li>Book parking spots in advance</li>
                    <li>Manage your vehicles</li>
                    <li>View parking history</li>
                    <li>Receive real-time notifications</li>
                </ul>
                <p>
                    <a href="{{ verification_link }}" class="button">Verify Your Email</a>
                </p>
                <p>If you didn't create this account, please ignore this email.</p>
            </div>
            <div class="footer">
                <p>&copy; 2024 Parking System. All rights reserved.</p>
                <p>
                    <a href="{{ unsubscribe_link }}">Unsubscribe</a> |
                    <a href="{{ privacy_policy_link }}">Privacy Policy</a>
                </p>
            </div>
        </div>
    </body>
    </html>
  
  booking_confirmation.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <title>Booking Confirmation</title>
        <style>
            body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
            .container { max-width: 600px; margin: 0 auto; padding: 20px; }
            .header { background-color: #2196F3; color: white; padding: 20px; text-align: center; }
            .content { padding: 20px; }
            .booking-details { background-color: #f9f9f9; padding: 15px; border-radius: 5px; margin: 20px 0; }
            .detail-row { margin-bottom: 10px; }
            .detail-label { font-weight: bold; }
            .footer { margin-top: 20px; padding: 20px; font-size: 12px; color: #666; text-align: center; }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>Booking Confirmed!</h1>
            </div>
            <div class="content">
                <h2>Thank you, {{ user_name }}!</h2>
                <p>Your parking booking has been confirmed.</p>
                
                <div class="booking-details">
                    <h3>Booking Details:</h3>
                    <div class="detail-row">
                        <span class="detail-label">Booking ID:</span> {{ booking_id }}
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Location:</span> {{ parking_location }}
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Spot Number:</span> {{ spot_number }}
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Date:</span> {{ booking_date }}
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Time:</span> {{ start_time }} - {{ end_time }}
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Duration:</span> {{ duration }} hours
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Total Amount:</span> ${{ total_amount }}
                    </div>
                </div>
                
                <p>
                    <a href="{{ view_booking_link }}" class="button">View Booking</a>
                    <a href="{{ cancel_booking_link }}" class="button" style="background-color: #f44336;">Cancel Booking</a>
                </p>
            </div>
            <div class="footer">
                <p>&copy; 2024 Parking System. All rights reserved.</p>
            </div>
        </div>
    </body>
    </html>
  
  payment_receipt.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <title>Payment Receipt</title>
        <style>
            body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
            .container { max-width: 600px; margin: 0 auto; padding: 20px; }
            .header { background-color: #4CAF50; color: white; padding: 20px; text-align: center; }
            .content { padding: 20px; }
            .receipt-details { background-color: #f9f9f9; padding: 15px; border-radius: 5px; margin: 20px 0; }
            .amount { font-size: 24px; font-weight: bold; color: #4CAF50; }
            .footer { margin-top: 20px; padding: 20px; font-size: 12px; color: #666; text-align: center; }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>Payment Receipt</h1>
            </div>
            <div class="content">
                <h2>Payment Successful!</h2>
                
                <div class="receipt-details">
                    <h3>Receipt #{{ receipt_number }}</h3>
                    <div class="detail-row">
                        <span class="detail-label">Transaction ID:</span> {{ transaction_id }}
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Date:</span> {{ payment_date }}
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Payment Method:</span> {{ payment_method }}
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Description:</span> {{ description }}
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Amount:</span> 
                        <span class="amount">${{ amount }}</span>
