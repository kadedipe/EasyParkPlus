  payment_receipt.txt: |
    Receipt #{{ receipt_number }}: ${{ amount }} paid for {{ description }}. 
    Thank you for using Parking System!
    
  verification_code.txt: |
    Your Parking System verification code is: {{ verification_code }}
    Valid for {{ validity_minutes }} minutes.
    
  parking_session_started.txt: |
