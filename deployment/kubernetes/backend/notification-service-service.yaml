apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: parking-system
  labels:
    app: notification-service
    component: backend
    tier: microservice
    service-type: notification-delivery
    version: "1.0.0"
    managed-by: kubectl
    compliance: gdpr
  annotations:
    description: "Notification delivery microservice for parking system"
    built-with: "python"
    repository: "parking-management/notification-service"
    gdpr-scope: "in-scope"
    data-classification: "sensitive"
data:
  # Application Configuration
  APP_NAME: "Notification Delivery Service"
  APP_ENV: "production"
  APP_PORT: "8000"
  APP_VERSION: "1.0.0"
  APP_TIMEZONE: "UTC"
  API_PREFIX: "/api/v1/notifications"
  API_DOCS_PATH: "/docs"
  API_DOCS_ENABLED: "false"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "/app"
  
  # Service Discovery
  SERVICE_NAME: "notification-service"
  SERVICE_HOST: "notification-service.parking-system.svc.cluster.local"
  SERVICE_PORT: "8000"
  
  # Database Configuration
  DB_HOST: "pgpool.parking-system.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "notification_db"
  DB_SCHEMA: "notifications"
  DB_SSL_MODE: "require"
  DB_MAX_POOL_SIZE: "15"
  DB_MIN_POOL_SIZE: "3"
  DB_IDLE_TIMEOUT: "30000"
  DB_CONNECTION_TIMEOUT: "15000"
  DB_STATEMENT_TIMEOUT: "5000"
  
  # Read Replica Configuration
  DB_READER_HOST: "postgres-reader-service.parking-system.svc.cluster.local"
  DB_READER_PORT: "5432"
  DB_READER_NAME: "notification_db"
  READ_REPLICA_ENABLED: "true"
  
  # Redis Cache Configuration
  REDIS_HOST: "redis-master-service.parking-system.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "10"
  REDIS_CACHE_DB: "11"
  REDIS_TIMEOUT: "2000"
  REDIS_MAX_RETRIES: "3"
  REDIS_RETRY_STRATEGY: "exponential"
  REDIS_POOL_SIZE: "15"
  REDIS_HEALTH_CHECK_INTERVAL: "30"
  
  # Cache Configuration
  CACHE_ENABLED: "true"
  CACHE_TTL_TEMPLATES: "3600"
  CACHE_TTL_PREFERENCES: "300"
  CACHE_TTL_DEVICES: "600"
  CACHE_TTL_RATE_LIMITS: "60"
  CACHE_PREFIX: "notification_service"
  CACHE_NULL_VALUES: "false"
  
  # Email Configuration
  SMTP_HOST: "smtp.parking-system.com"
  SMTP_PORT: "587"
  SMTP_SECURE: "true"
  SMTP_TIMEOUT: "10000"
  SMTP_POOL_SIZE: "5"
  SMTP_MAX_CONNECTIONS: "5"
  SMTP_RATE_LIMIT: "100"
  SMTP_RATE_LIMIT_WINDOW: "60"
  EMAIL_FROM_ADDRESS: "notifications@parking-system.com"
  EMAIL_FROM_NAME: "Parking System"
  EMAIL_REPLY_TO: "support@parking-system.com"
  EMAIL_BCC_ENABLED: "false"
  EMAIL_TRACKING_ENABLED: "true"
  EMAIL_BATCH_SIZE: "50"
  EMAIL_RETRY_ATTEMPTS: "3"
  EMAIL_RETRY_DELAY: "300"
  EMAIL_MAX_ATTACHMENT_SIZE: "10485760"
  EMAIL_ALLOWED_ATTACHMENT_TYPES: "pdf,jpg,png"
  EMAIL_TEMPLATE_ENGINE: "jinja2"
  EMAIL_TEMPLATE_PATH: "/app/templates/email"
  
  # SMS Configuration
  SMS_PROVIDER: "twilio"
  SMS_FROM_NUMBER: "+1234567890"
  SMS_TIMEOUT: "5000"
  SMS_RATE_LIMIT: "50"
  SMS_RATE_LIMIT_WINDOW: "60"
  SMS_BATCH_SIZE: "20"
  SMS_RETRY_ATTEMPTS: "3"
  SMS_RETRY_DELAY: "60"
  SMS_MAX_CHARACTERS: "160"
  SMS_UNICODE_ENABLED: "true"
  SMS_TEMPLATE_PATH: "/app/templates/sms"
  
  # Push Notification Configuration
  PUSH_PROVIDER: "fcm"
  PUSH_IOS_ENABLED: "true"
  PUSH_ANDROID_ENABLED: "true"
  PUSH_WEB_ENABLED: "true"
  PUSH_TIMEOUT: "3000"
  PUSH_RATE_LIMIT: "200"
  PUSH_RATE_LIMIT_WINDOW: "60"
  PUSH_BATCH_SIZE: "100"
  PUSH_RETRY_ATTEMPTS: "2"
  PUSH_RETRY_DELAY: "30"
  PUSH_IOS_TOPIC: "com.parking.system"
  PUSH_ANDROID_COLLAPSE_KEY: "parking_notifications"
  PUSH_TTL: "86400"
  PUSH_PRIORITY: "high"
  PUSH_SOUND_ENABLED: "true"
  PUSH_BADGE_ENABLED: "true"
  PUSH_TEMPLATE_PATH: "/app/templates/push"
  
  # Webhook Configuration
  WEBHOOK_ENABLED: "true"
  WEBHOOK_TIMEOUT: "5000"
  WEBHOOK_RETRY_ATTEMPTS: "3"
  WEBHOOK_RETRY_DELAY: "60"
  WEBHOOK_CONCURRENCY: "10"
  WEBHOOK_SIGNATURE_ENABLED: "true"
  WEBHOOK_SIGNATURE_HEADER: "X-Notification-Signature"
  WEBHOOK_MAX_PAYLOAD_SIZE: "1048576"
  
  # In-App Notification Configuration
  IN_APP_ENABLED: "true"
  IN_APP_RETENTION_DAYS: "30"
  IN_APP_MAX_PER_USER: "100"
  IN_APP_BATCH_SIZE: "50"
  IN_APP_REALTIME_ENABLED: "true"
  IN_APP_WEBSOCKET_URL: "wss://notifications.parking-system.com"
  
  # Notification Preferences
  DEFAULT_NOTIFICATION_CHANNELS: "email,sms,push,in_app"
  MAX_CATEGORIES_PER_USER: "20"
  OPT_OUT_ENABLED: "true"
  OPT_OUT_WEBHOOK_ENABLED: "true"
  PREFERENCE_CACHE_ENABLED: "true"
  USER_PREFERENCE_DEFAULT: "all"
  
  # Notification Categories
  NOTIFICATION_CATEGORIES: |
    booking_confirmation,
    booking_reminder,
    booking_cancellation,
    payment_receipt,
    payment_failed,
    parking_session_started,
    parking_session_ended,
    parking_violation,
    account_verification,
    password_reset,
    security_alert,
    promotional,
    system_announcement,
    maintenance_alert
  
  # Template Management
  TEMPLATE_CACHE_ENABLED: "true"
  TEMPLATE_VERSIONING_ENABLED: "true"
  TEMPLATE_AUTO_COMPILE: "true"
  TEMPLATE_DEFAULT_LOCALE: "en_US"
  TEMPLATE_SUPPORTED_LOCALES: "en_US,es_ES,fr_FR,de_DE,zh_CN,ja_JP"
  TEMPLATE_VARIABLE_DELIMITERS: "{{,}}"
  
  # Scheduling
  SCHEDULED_NOTIFICATIONS_ENABLED: "true"
  SCHEDULER_POLL_INTERVAL: "30"
  SCHEDULER_BATCH_SIZE: "100"
  SCHEDULER_MAX_FUTURE_DAYS: "30"
  
  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_STRATEGY: "sliding_window"
  RATE_LIMIT_PER_USER: "100"
  RATE_LIMIT_PER_IP: "500"
  RATE_LIMIT_PER_SERVICE: "1000"
  RATE_LIMIT_WINDOW: "3600"
  BURST_LIMIT_ENABLED: "true"
  BURST_MULTIPLIER: "2"
  
  # Message Queue Configuration
  RABBITMQ_HOST: "rabbitmq.parking-system.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "/"
  RABBITMQ_NOTIFICATION_EXCHANGE: "notification.events"
  RABBITMQ_EMAIL_QUEUE: "notification.email"
  RABBITMQ_SMS_QUEUE: "notification.sms"
  RABBITMQ_PUSH_QUEUE: "notification.push"
  RABBITMQ_WEBHOOK_QUEUE: "notification.webhook"
  RABBITMQ_IN_APP_QUEUE: "notification.in_app"
  RABBITMQ_PREFETCH_COUNT: "10"
  
  # Monitoring
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"
  HEALTH_PATH: "/health"
  READINESS_PATH: "/ready"
  LIVENESS_PATH: "/alive"
  TRACING_ENABLED: "true"
  TRACING_SAMPLE_RATE: "0.1"
  PROFILER_ENABLED: "false"
  
  # Logging
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  LOG_INCLUDE_TRACE_ID: "true"
  LOG_MAX_BYTES: "104857600"
  LOG_BACKUP_COUNT: "10"
  SENSITIVE_DATA_MASKING: "true"
  SENSITIVE_FIELDS: "password,token,api_key,credit_card,cvv,ssn"
  LOG_EMAIL_CONTENT: "false"
  LOG_SMS_CONTENT: "false"
  LOG_PUSH_CONTENT: "false"
  
  # GDPR Compliance
  GDPR_COMPLIANCE_ENABLED: "true"
  DATA_RETENTION_DAYS: "90"
  ANONYMIZE_AFTER_DAYS: "365"
  DELETE_AFTER_DAYS: "730"
  CONSENT_TRACKING_ENABLED: "true"
  RIGHT_TO_ERASURE_ENABLED: "true"
  DATA_EXPORT_ENABLED: "true"
  
  # Feature Flags
  FEATURE_EMAIL_ENABLED: "true"
  FEATURE_SMS_ENABLED: "true"
  FEATURE_PUSH_ENABLED: "true"
  FEATURE_WEBHOOK_ENABLED: "true"
  FEATURE_IN_APP_ENABLED: "true"
  FEATURE_SCHEDULED_NOTIFICATIONS: "true"
  FEATURE_TEMPLATE_PREVIEW: "true"
  FEATURE_BULK_NOTIFICATIONS: "true"
  FEATURE_PERSONALIZATION: "true"
  FEATURE_ATTACHMENTS: "true"
  FEATURE_READ_RECEIPTS: "true"
  FEATURE_ANALYTICS: "true"
  FEATURE_A/B_TESTING: "false"
  FEATURE_AI_PERSONALIZATION: "false"
---
