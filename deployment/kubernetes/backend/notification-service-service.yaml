                </div>
                
                <p>Thank you for your payment!</p>
                <p><a href="{{ download_receipt_link }}">Download PDF Receipt</a></p>
            </div>
            <div class="footer">
                <p>&copy; 2024 Parking System. All rights reserved.</p>
            </div>
        </div>
    </body>
    </html>
