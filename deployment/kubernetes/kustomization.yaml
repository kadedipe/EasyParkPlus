apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: parking-system

resources:
# Namespaces
- namespace.yaml

# ConfigMaps
- configmaps/app-config.yaml
- configmaps/postgres-config.yaml
- configmaps/redis-config.yaml
- configmaps/kong-config.yaml

# Secrets
- secrets/postgres-secret.yaml
- secrets/redis-secret.yaml
- secrets/app-secret.yaml
- secrets/tls-secret.yaml

# Storage
- storage/postgres-pvc.yaml
- storage/redis-pvc.yaml

# Databases
- databases/postgres-statefulset.yaml
- databases/redis-statefulset.yaml

# Backend Services
- backend/parking-api-deployment.yaml
- backend/user-service-deployment.yaml
- backend/payment-service-deployment.yaml
- backend/notification-service-deployment.yaml
- backend/analytics-service-deployment.yaml

# API Gateway
- gateway/kong-deployment.yaml
- gateway/kong-ingress.yaml

# Network Policies
- network-policies/default-deny.yaml
- network-policies/allow-api-gateway.yaml
- network-policies/allow-database.yaml

# HPA
- hpa/parking-api-hpa.yaml
- hpa/user-service-hpa.yaml
- hpa/payment-service-hpa.yaml

images:
- name: parking-management/parking-api
  newTag: v1.0.0
- name: parking-management/user-service
  newTag: v1.0.0
- name: parking-management/payment-service
  newTag: v1.0.0
- name: parking-management/notification-service
  newTag: v1.0.0
- name: parking-management/analytics-service
  newTag: v1.0.0

patchesStrategicMerge:
- patches/increase-resources.yaml
- patches/add-node-selector.yaml

configMapGenerator:
- name: app-config
  behavior: merge
  literals:
  - APP_VERSION=v1.0.0
  - DEPLOYMENT_TIMESTAMP=2024-01-01

secretGenerator:
- name: app-secret
  behavior: merge
  literals:
  - DEPLOYMENT_KEY=random-key-here

commonLabels:
  environment: production
  managed-by: kustomize

commonAnnotations:
  version: v1.0.0
  organization: parking-management
  repository: https://github.com/parking-management/deployment

patches:
- target:
    kind: Deployment
    name: .*-service
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: DEPLOYMENT_TIME
        value: ${DEPLOYMENT_TIME}
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: monitoring
  namespace: parking-monitoring

resources:
- namespace.yaml
- storage/prometheus-pvc.yaml
- storage/grafana-pvc.yaml
- monitoring/prometheus-deployment.yaml
- monitoring/prometheus-config.yaml
- monitoring/grafana-deployment.yaml
- monitoring/grafana-datasources.yaml
- monitoring/grafana-dashboards.yaml
- monitoring/node-exporter-daemonset.yaml
- monitoring/cadvisor-daemonset.yaml

configMapGenerator:
- name: prometheus-config
  behavior: merge
- name: grafana-datasources
  behavior: merge
- name: grafana-dashboards-providers
  behavior: merge

secretGenerator:
- name: app-secret
  namespace: parking-monitoring
  behavior: merge