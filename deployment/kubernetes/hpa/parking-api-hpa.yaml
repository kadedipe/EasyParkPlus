apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parking-api-hpa
  namespace: parking-system
  labels:
    app: parking-api
    component: backend
    part-of: parking-management-system
    managed-by: kubectl
    hpa-type: resource-based
  annotations:
    description: "Horizontal Pod Autoscaler for Parking API service"
    autoscaling.alpha.kubernetes.io/behavior: "scale-down-stabilization"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: parking-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: 100
  - type: Object
    object:
      metric:
        name: requests_per_second
      describedObject:
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        name: parking-api-ingress
      target:
        type: Value
        value: 1k
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
      - type: Percent
        value: 50
        periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 120
      - type: Percent
        value: 10
        periodSeconds: 120
      selectPolicy: Min
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parking-api-custom-hpa
  namespace: parking-system
  labels:
    app: parking-api
    component: backend
    part-of: parking-management-system
    managed-by: kubectl
    hpa-type: custom-metrics
  annotations:
    description: "Custom metrics based HPA for Parking API service"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: parking-api
  minReplicas: 2
  maxReplicas: 15
  metrics:
  - type: External
    external:
      metric:
        name: queue_messages_ready
        selector:
          matchLabels:
            queue: parking-notifications
      target:
        type: AverageValue
        averageValue: 50
  - type: External
    external:
      metric:
        name: kafka_consumer_lag
        selector:
          matchLabels:
            consumer-group: parking-api-group
      target:
        type: AverageValue
        averageValue: 100
  behavior:
    scaleUp:
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      stabilizationWindowSeconds: 30
    scaleDown:
      policies:
      - type: Percent
        value: 20
        periodSeconds: 120
      stabilizationWindowSeconds: 300
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: parking-api-hpa-config
  namespace: parking-system
  labels:
    app: parking-api
    component: backend
    part-of: parking-management-system
data:
  hpa-config.json: |
    {
      "cpuTargetUtilization": 70,
      "memoryTargetUtilization": 80,
      "requestThreshold": 1000,
      "scaleUpSpeed": "normal",
      "scaleDownStability": "conservative",
      "businessHours": {
        "peakStart": "08:00",
        "peakEnd": "20:00",
        "peakMinReplicas": 5,
        "offPeakMinReplicas": 2
      },
      "metrics": {
        "httpRequests": true,
        "queueLength": true,
        "databaseConnections": true
      }
    }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parking-api-business-hours-hpa
  namespace: parking-system
  labels:
    app: parking-api
    component: backend
    part-of: parking-management-system
    hpa-type: time-based
  annotations:
    description: "Business hours aware HPA for Parking API service"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: parking-api
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 45
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 360
      policies:
      - type: Percent
        value: 15
        periodSeconds: 180