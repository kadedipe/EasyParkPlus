apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service-hpa
  namespace: parking-system
  labels:
    app: payment-service
    component: backend
    part-of: parking-management-system
    service-type: financial
    compliance: pci-dss
    managed-by: kubectl
    hpa-type: resource-based
  annotations:
    description: "Horizontal Pod Autoscaler for Payment Processing Service"
    compliance.pci-dss.kubernetes.io/scope: "payment-processing"
    autoscaling.alpha.kubernetes.io/behavior: "conservative-scale-down"
    monitoring.kubernetes.io/metrics: "transaction-rate,error-rate,latency"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: 3
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  - type: Pods
    pods:
      metric:
        name: transactions_per_second
      target:
        type: AverageValue
        averageValue: 30
  - type: Object
    object:
      metric:
        name: payment_processing_duration_seconds
      describedObject:
        apiVersion: v1
        kind: Service
        name: payment-service
      target:
        type: Value
        value: 0.5
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 45
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
      - type: Percent
        value: 30
        periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Pods
        value: 1
        periodSeconds: 300
      - type: Percent
        value: 5
        periodSeconds: 300
      selectPolicy: Min
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service-transaction-hpa
  namespace: parking-system
  labels:
    app: payment-service
    component: backend
    part-of: parking-management-system
    service-type: transaction-aware
    managed-by: kubectl
    hpa-type: transaction-based
  annotations:
    description: "Transaction-based HPA for Payment Service"
    monitoring.kubernetes.io/scrape: "true"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: External
    external:
      metric:
        name: pending_transactions_total
        selector:
          matchLabels:
            service: payment-service
            status: pending
      target:
        type: AverageValue
        averageValue: 50
  - type: External
    external:
      metric:
        name: payment_queue_depth
        selector:
          matchLabels:
            queue: payment-processing
            priority: high
      target:
        type: AverageValue
        averageValue: 20
  - type: External
    external:
      metric:
        name: stripe_api_latency
        selector:
          matchLabels:
            provider: stripe
            environment: production
      target:
        type: AverageValue
        averageValue: 200
  behavior:
    scaleUp:
      policies:
      - type: Percent
        value: 50
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      stabilizationWindowSeconds: 30
    scaleDown:
      policies:
      - type: Percent
        value: 10
        periodSeconds: 240
      stabilizationWindowSeconds: 480
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-hpa-config
  namespace: parking-system
  labels:
    app: payment-service
    component: backend
    part-of: parking-management-system
data:
  hpa-config.json: |
    {
      "cpuTargetUtilization": 60,
      "memoryTargetUtilization": 70,
      "transactionThreshold": 30,
      "pendingTransactionThreshold": 50,
      "queueDepthThreshold": 20,
      "scaleUpSpeed": "moderate",
      "scaleDownStability": "very-conservative",
      "businessHours": {
        "peakStart": "08:00",
        "peakEnd": "22:00",
        "weekendPeakStart": "10:00",
        "weekendPeakEnd": "20:00",
        "peakMinReplicas": 5,
        "offPeakMinReplicas": 3
      },
      "paymentProviders": {
        "stripe": {
          "latencyThreshold": 200,
          "errorRateThreshold": 1
        },
        "paypal": {
          "latencyThreshold": 300,
          "errorRateThreshold": 2
        }
      },
      "financial": {
        "highValueThreshold": 1000,
        "requireAuditTrail": true,
        "fraudDetectionScaling": true
      }
    }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service-error-rate-hpa
  namespace: parking-system
  labels:
    app: payment-service
    component: backend
    part-of: parking-management-system
    service-type: error-aware
    managed-by: kubectl
    hpa-type: error-based
  annotations:
    description: "Error-aware HPA for Payment Service to handle failures"
    alert.kubernetes.io/severity: "high"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: 3
  maxReplicas: 25
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 55
  - type: External
    external:
      metric:
        name: payment_errors_total
        selector:
          matchLabels:
            type: processing-error
            severity: critical
      target:
        type: AverageValue
        averageValue: 5
  - type: External
    external:
      metric:
        name: failed_payment_retry_count
        selector:
          matchLabels:
            service: payment-service
            action: retry
      target:
        type: AverageValue
        averageValue: 10
  - type: External
    external:
      metric:
        name: payment_timeout_rate
        selector:
          matchLabels:
            service: payment-service
            reason: timeout
      target:
        type: AverageValue
        averageValue: 2
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 20
      policies:
      - type: Percent
        value: 100
        periodSeconds: 20
      - type: Pods
        value: 3
        periodSeconds: 20
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 900
      policies:
      - type: Percent
        value: 5
        periodSeconds: 300
      selectPolicy: Min
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service-fraud-detection-hpa
  namespace: parking-system
  labels:
    app: payment-service
    component: backend
    part-of: parking-management-system
    service-type: fraud-aware
    managed-by: kubectl
    hpa-type: fraud-based
  annotations:
    description: "Fraud detection aware HPA for Payment Service"
    security.kubernetes.io/fraud-detection: "enabled"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: 3
  maxReplicas: 30
  metrics:
  - type: External
    external:
      metric:
        name: high_value_transactions
        selector:
          matchLabels:
            amount: ">1000"
            status: processing
      target:
        type: AverageValue
        averageValue: 10
  - type: External
    external:
      metric:
        name: suspicious_patterns_detected
        selector:
          matchLabels:
            risk-level: high
      target:
        type: AverageValue
        averageValue: 3
  - type: External
    external:
      metric:
        name: velocity_check_alerts
        selector:
          matchLabels:
            type: unusual-velocity
      target:
        type: AverageValue
        averageValue: 5
  behavior:
    scaleUp:
      policies:
      - type: Percent
        value: 150
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      stabilizationWindowSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 1200
      policies:
      - type: Percent
        value: 3
        periodSeconds: 600
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-service-pdb
  namespace: parking-system
  labels:
    app: payment-service
    component: backend
    part-of: parking-management-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: payment-service
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service-metrics
  namespace: parking-system
  labels:
    app: payment-service
    component: monitoring
    part-of: parking-management-system
spec:
  selector:
    app: payment-service
  ports:
  - name: metrics
    port: 8082
    targetPort: 8082
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-service-hpa-network-policy
  namespace: parking-system
  labels:
    app: payment-service
    component: hpa
    part-of: parking-management-system
spec:
  podSelector:
    matchLabels:
      app: payment-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app: metrics-server
    ports:
    - protocol: TCP
      port: 8082
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80