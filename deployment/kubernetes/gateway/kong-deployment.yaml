apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: parking-system
  labels:
    app: kong
    component: gateway
    version: "3.4"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kong
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: kong
        component: gateway
        version: "3.4"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9540"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: kong
        image: kong:3.4-alpine
        ports:
        - containerPort: 8000
          name: proxy
        - containerPort: 8443
          name: proxy-ssl
        - containerPort: 8001
          name: admin
        - containerPort: 8444
          name: admin-ssl
        - containerPort: 8100
          name: status
        - containerPort: 9540
          name: metrics
        env:
        - name: KONG_PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kong-postgres-secret
              key: KONG_PG_PASSWORD
        - name: KONG_PG_HOST
          value: postgres-service.parking-system
        - name: KONG_PG_DATABASE
          value: kong
        - name: KONG_PG_USER
          value: kong
        - name: KONG_PROXY_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_ADMIN_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_PROXY_ERROR_LOG
          value: /dev/stderr
        - name: KONG_ADMIN_ERROR_LOG
          value: /dev/stderr
        - name: KONG_PLUGINS
          value: bundled,rate-limiting,jwt,acl,cors,proxy-cache,prometheus
        - name: KONG_LOG_LEVEL
          value: notice
        - name: KONG_NGINX_WORKER_PROCESSES
          value: auto
        - name: KONG_PROXY_LISTEN
          value: 0.0.0.0:8000
        - name: KONG_PROXY_LISTEN_SSL
          value: 0.0.0.0:8443
        - name: KONG_ADMIN_LISTEN
          value: 0.0.0.0:8001
        - name: KONG_ADMIN_LISTEN_SSL
          value: 0.0.0.0:8444
        - name: KONG_STATUS_LISTEN
          value: 0.0.0.0:8100
        - name: KONG_PROMETHEUS_ENABLED
          value: "on"
        - name: KONG_PROMETHEUS_PORT
          value: "9540"
        - name: KONG_SSL_CERT
          value: /etc/kong/ssl/tls.crt
        - name: KONG_SSL_CERT_KEY
          value: /etc/kong/ssl/tls.key
        volumeMounts:
        - name: kong-config
          mountPath: /etc/kong/kong.conf
          subPath: kong.conf
        - name: kong-ssl
          mountPath: /etc/kong/ssl
          readOnly: true
        - name: kong-tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /status
            port: 8100
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /status
            port: 8100
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "kong quit"]
      - name: kong-init
        image: curlimages/curl:8.4.0
        command:
        - sh
        - -c
        - |
          until kong health; do
            echo "Waiting for Kong..."
            sleep 5
          done
          
          # Import configuration
          sh /config/init.sh
        volumeMounts:
        - name: kong-init-scripts
          mountPath: /config
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: kong-config
        configMap:
          name: kong-config
      - name: kong-init-scripts
        configMap:
          name: kong-init-scripts
      - name: kong-ssl
        secret:
          secretName: tls-secret
      - name: kong-tmp
        emptyDir: {}
      initContainers:
      - name: kong-migrations
        image: kong:3.4-alpine
        command:
        - sh
        - -c
        - |
          kong migrations bootstrap
          kong migrations up
        env:
        - name: KONG_PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kong-postgres-secret
              key: KONG_PG_PASSWORD
        - name: KONG_PG_HOST
          value: postgres-service.parking-system
        - name: KONG_PG_DATABASE
          value: kong
        - name: KONG_PG_USER
          value: kong
        volumeMounts:
        - name: kong-config
          mountPath: /etc/kong/kong.conf
          subPath: kong.conf
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
      serviceAccountName: kong-sa
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - kong
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        workload-type: gateway
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: parking-system
  labels:
    app: kong
    component: proxy
spec:
  selector:
    app: kong
  ports:
  - name: proxy
    port: 80
    targetPort: 8000
  - name: proxy-ssl
    port: 443
    targetPort: 8443
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: parking-system
  labels:
    app: kong
    component: admin
spec:
  selector:
    app: kong
  ports:
  - name: admin
    port: 8001
    targetPort: 8001
  - name: admin-ssl
    port: 8444
    targetPort: 8444
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: kong-metrics
  namespace: parking-system
  labels:
    app: kong
    component: metrics
spec:
  selector:
    app: kong
  ports:
  - name: metrics
    port: 9540
    targetPort: 9540
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kong-sa
  namespace: parking-system