apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: parking-monitoring
  labels:
    app: prometheus
    component: monitoring
    part-of: parking-management-system
    managed-by: kubectl
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    description: "Prometheus monitoring service for parking management system"
spec:
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
    protocol: TCP
  - name: metrics
    port: 9091
    targetPort: 9090
    protocol: TCP
  type: ClusterIP
  sessionAffinity: None
  publishNotReadyAddresses: false