apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: parking-monitoring
  labels:
    app: node-exporter
    component: monitoring
    part-of: parking-management-system
    managed-by: kubectl
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"
    prometheus.io/path: "/metrics"
    description: "Node exporter service for collecting host-level metrics from Kubernetes nodes"
spec:
  selector:
    app: node-exporter
  ports:
  - name: metrics
    port: 9100
    targetPort: 9100
    protocol: TCP
  - name: http-metrics
    port: 80
    targetPort: 9100
    protocol: TCP
  type: ClusterIP
  clusterIP: None
  sessionAffinity: None
  publishNotReadyAddresses: true
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter-headless
  namespace: parking-monitoring
  labels:
    app: node-exporter
    component: monitoring
    part-of: parking-management-system
    service-type: headless
    managed-by: kubectl
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"
    prometheus.io/path: "/metrics"
    description: "Headless service for node exporter daemonset discovery"
spec:
  selector:
    app: node-exporter
  ports:
  - name: metrics
    port: 9100
    targetPort: 9100
    protocol: TCP
  clusterIP: None
  type: ClusterIP
  publishNotReadyAddresses: true
---
apiVersion: v1
kind: Endpoints
metadata:
  name: node-exporter
  namespace: parking-monitoring
  labels:
    app: node-exporter
    component: monitoring
    part-of: parking-management-system
  annotations:
    description: "Endpoints for node exporter metrics collection from all nodes"
subsets: []
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: node-exporter
  namespace: parking-monitoring
  labels:
    app: node-exporter
    component: monitoring
    part-of: parking-management-system
    kubernetes.io/service-name: node-exporter
addressType: IPv4
ports:
- name: metrics
  port: 9100
  protocol: TCP
endpoints: []