apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: parking-monitoring
  labels:
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus.parking-monitoring:9090
      isDefault: true
      version: 1
      editable: false
      jsonData:
        timeInterval: 15s
        queryTimeout: 60s
        httpMethod: POST
        manageAlerts: true
    
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.parking-monitoring:3100
      version: 1
      editable: false
      jsonData:
        maxLines: 1000
        derivedFields:
        - name: "trace_id"
          matcherRegex: "trace_id=(\\w+)"
          url: "http://tempo.parking-monitoring:3200/trace/$${__value.raw}"
    
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.parking-monitoring:3200
      version: 1
      editable: false
      jsonData:
        nodeGraph:
          enabled: true
        search:
          hide: false
        tracesToLogs:
          datasourceUid: loki
          tags: ['instance', 'pod', 'namespace']
          mappedTags: [{ key: 'service.name', value: 'service' }]
          mapTagNamesEnabled: true
          spanStartTimeShift: '1h'
          spanEndTimeShift: '-1h'
          filterByTraceID: true
          filterBySpanID: true
    
    - name: PostgreSQL
      type: postgres
      access: proxy
      url: postgres-service.parking-system:5432
      database: parking_db
      user: grafana_viewer
      secureJsonData:
        password: ${POSTGRES_PASSWORD}
      jsonData:
        sslmode: disable
        postgresVersion: 1400
        timescaledb: false
    
    - name: CloudWatch
      type: cloudwatch
      access: proxy
      jsonData:
        authType: keys
        defaultRegion: us-east-1
      secureJsonData:
        accessKey: ${AWS_ACCESS_KEY_ID}
        secretKey: ${AWS_SECRET_ACCESS_KEY}
    
    deleteDatasources:
    - name: Prometheus
      orgId: 1
    - name: Loki
      orgId: 1