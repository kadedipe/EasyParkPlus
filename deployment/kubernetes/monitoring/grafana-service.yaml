apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: parking-monitoring
  labels:
    app: grafana
    component: monitoring
    part-of: parking-management-system
    managed-by: kubectl
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    description: "Grafana dashboard service for parking management system visualization"
spec:
  selector:
    app: grafana
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: grafana
    port: 3000
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
  sessionAffinity: None
  publishNotReadyAddresses: false
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: parking-monitoring
  labels:
    app: grafana
    component: monitoring
    part-of: parking-management-system
    exposure: external
    managed-by: kubectl
  annotations:
    description: "NodePort service for external access to Grafana dashboards"
spec:
  selector:
    app: grafana
  ports:
  - name: http
    port: 80
    targetPort: 3000
    nodePort: 30300
    protocol: TCP
  type: NodePort
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-headless
  namespace: parking-monitoring
  labels:
    app: grafana
    component: monitoring
    part-of: parking-management-system
  annotations:
    description: "Headless service for Grafana statefulset"
spec:
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  clusterIP: None
  type: ClusterIP