apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: parking-system
  labels:
    app: postgres
    component: database
    type: primary
    version: "14"
    managed-by: kubectl
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
    prometheus.io/path: "/metrics"
    description: "PostgreSQL primary database service for parking management system"
spec:
  selector:
    app: postgres
    statefulset.kubernetes.io/pod-name: postgres-0
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
    protocol: TCP
  - name: metrics
    port: 9187
    targetPort: 9187
    protocol: TCP
  type: ClusterIP
  clusterIP: None
  sessionAffinity: None
---
