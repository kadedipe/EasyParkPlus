name: Continuous Deployment

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY_BACKEND: parking-backend
  ECR_REPOSITORY_FRONTEND: parking-frontend
  K8S_NAMESPACE: parking-system

jobs:
  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'staging' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: staging
      url: https://staging.parking.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

      - name: Deploy to EKS
        run: |
          # Update images in deployment files
          sed -i "s|BACKEND_IMAGE_PLACEHOLDER|${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_BACKEND }}:${{ github.sha }}|g" deployment/kubernetes/backend-deployment.yaml
          sed -i "s|FRONTEND_IMAGE_PLACEHOLDER|${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FRONTEND }}:${{ github.sha }}|g" deployment/kubernetes/frontend-deployment.yaml
          
          # Apply Kubernetes manifests
          kubectl apply -f deployment/kubernetes/namespace.yaml
          kubectl apply -f deployment/kubernetes/configmap.yaml
          kubectl apply -f deployment/kubernetes/secrets.yaml
          kubectl apply -f deployment/kubernetes/backend-deployment.yaml
          kubectl apply -f deployment/kubernetes/backend-service.yaml
          kubectl apply -f deployment/kubernetes/frontend-deployment.yaml
          kubectl apply -f deployment/kubernetes/frontend-service.yaml
          kubectl apply -f deployment/kubernetes/ingress.yaml

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/backend -n ${{ env.K8S_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/frontend -n ${{ env.K8S_NAMESPACE }} --timeout=5m

      - name: Run smoke tests
        run: |
          curl -f https://staging.parking.example.com/api/v1/health
          curl -f https://staging.parking.example.com

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event.inputs.environment == 'production' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://parking.example.com
    concurrency: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 --decode > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

      - name: Deploy to production with blue-green
        run: |
          # Blue deployment
          kubectl apply -f deployment/kubernetes/production/blue/
          
          # Wait for blue deployment
          kubectl rollout status deployment/backend-blue -n ${{ env.K8S_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/frontend-blue -n ${{ env.K8S_NAMESPACE }} --timeout=5m
          
          # Test blue deployment
          kubectl port-forward service/backend-blue 8000:8000 -n ${{ env.K8S_NAMESPACE }} &
          sleep 5
          curl -f http://localhost:8000/api/v1/health
          
          # Switch traffic to blue
          kubectl patch service backend -n ${{ env.K8S_NAMESPACE }} -p '{"spec":{"selector":{"version":"blue"}}}'
          kubectl patch service frontend -n ${{ env.K8S_NAMESPACE }} -p '{"spec":{"selector":{"version":"blue"}}}'
          
          # Clean up green
          kubectl delete -f deployment/kubernetes/production/green/ || true

      - name: Run post-deployment checks
        run: |
          # Health checks
          endpoints=(
            "https://parking.example.com/api/v1/health"
            "https://parking.example.com/api/v1/metrics"
            "https://parking.example.com"
          )
          for endpoint in "${endpoints[@]}"; do
            curl -f -s -o /dev/null -w "%{http_code}\n" "$endpoint" | grep 200
          done

      - name: Run database migrations
        run: |
          kubectl create job --from=cronjob/backend-migrations migration-manual -n ${{ env.K8S_NAMESPACE }}
          kubectl wait --for=condition=complete job/migration-manual -n ${{ env.K8S_NAMESPACE }} --timeout=5m

      - name: Notify success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": "🚀 Production deployment successful: ${{ github.ref_name }}",
              "attachments": [{
                "fields": [
                  {"title": "Version", "value": "'"${{ github.ref_name }}"'", "short": true},
                  {"title": "Commit", "value": "'"${{ github.sha }}"'", "short": true},
                  {"title": "Environment", "value": "production", "short": true},
                  {"title": "URL", "value": "https://parking.example.com", "short": true}
                ]
              }]
            }' ${{ secrets.SLACK_WEBHOOK_PROD }}

      - name: Notify failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": "❌ Production deployment failed: ${{ github.ref_name }}",
              "attachments": [{
                "color": "danger",
                "fields": [
                  {"title": "Version", "value": "'"${{ github.ref_name }}"'", "short": true},
                  {"title": "Commit", "value": "'"${{ github.sha }}"'", "short": true},
                  {"title": "Environment", "value": "production", "short": true},
                  {"title": "Action", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>", "short": true}
                ]
              }]
            }' ${{ secrets.SLACK_WEBHOOK_PROD }}