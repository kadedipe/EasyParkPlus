name: Mark stale issues and PRs

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v8
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          
          # Issue settings
          stale-issue-message: 'This issue has been automatically marked as stale due to 60 days of inactivity. It will be closed in 7 days if no further activity occurs.'
          stale-issue-label: 'status: stale'
          exempt-issue-labels: 'priority: critical,priority: high,status: blocked,security'
          days-before-issue-stale: 60
          days-before-issue-close: 7
          
          # PR settings
          stale-pr-message: 'This PR has been automatically marked as stale due to 30 days of inactivity. It will be closed in 7 days if no further activity occurs.'
          stale-pr-label: 'status: stale'
          exempt-pr-labels: 'priority: critical,priority: high,status: blocked,security'
          days-before-pr-stale: 30
          days-before-pr-close: 7
          
          # General settings
          operations-per-run: 100
          remove-stale-when-updated: true
          close-issue-reason: not_planned