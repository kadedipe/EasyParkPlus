# Type labels
- name: "type: feature"
  color: "0e8a16"
  description: "New feature or enhancement"

- name: "type: bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "type: documentation"
  color: "0075ca"
  description: "Documentation updates"

- name: "type: maintenance"
  color: "fbca04"
  description: "Code maintenance, refactoring, technical debt"

- name: "type: performance"
  color: "5319e7"
  description: "Performance improvements"

- name: "type: security"
  color: "b60205"
  description: "Security related issues"

# Priority labels
- name: "priority: critical"
  color: "b60205"
  description: "Critical priority - must be fixed immediately"

- name: "priority: high"
  color: "d93f0b"
  description: "High priority - should be addressed soon"

- name: "priority: medium"
  color: "fbca04"
  description: "Medium priority - normal workflow"

- name: "priority: low"
  color: "0e8a16"
  description: "Low priority - nice to have"

# Status labels
- name: "status: blocked"
  color: "000000"
  description: "Blocked by something else"

- name: "status: in-progress"
  color: "0052cc"
  description: "Currently being worked on"

- name: "status: review-needed"
  color: "5319e7"
  description: "Ready for review"

- name: "status: waiting"
  color: "bfd4f2"
  description: "Waiting for input or decision"

- name: "status: duplicate"
  color: "cfd3d7"
  description: "Duplicate of another issue"

- name: "status: wontfix"
  color: "ffffff"
  description: "Will not be fixed"

# Area labels
- name: "area: backend"
  color: "1d76db"
  description: "Backend related"

- name: "area: frontend"
  color: "fbca04"
  description: "Frontend related"

- name: "area: api"
  color: "5319e7"
  description: "API related"

- name: "area: database"
  color: "0052cc"
  description: "Database related"

- name: "area: ui/ux"
  color: "d4c5f9"
  description: "UI/UX related"

- name: "area: testing"
  color: "bfdadc"
  description: "Testing related"

- name: "area: ci/cd"
  color: "bfdadc"
  description: "CI/CD related"

- name: "area: security"
  color: "b60205"
  description: "Security related"

# Dependencies
- name: "dependencies"
  color: "0366d6"
  description: "Pull requests that update dependencies"

- name: "automated-pr"
  color: "0075ca"
  description: "Automatically generated pull request"

# Size labels
- name: "size: xs"
  color: "0e8a16"
  description: "Extra small change (< 10 lines)"

- name: "size: s"
  color: "7a5901"
  description: "Small change (10-50 lines)"

- name: "size: m"
  color: "fbca04"
  description: "Medium change (50-200 lines)"

- name: "size: l"
  color: "d93f0b"
  description: "Large change (200-500 lines)"

- name: "size: xl"
  color: "b60205"
  description: "Extra large change (> 500 lines)"