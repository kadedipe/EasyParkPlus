# ============================================
# PRETTIER CONFIGURATION - PARKING MANAGEMENT SYSTEM FRONTEND
# ============================================

printWidth: 100
tabWidth: 2
useTabs: false
semi: true
singleQuote: true
quoteProps: "as-needed"
jsxSingleQuote: false
trailingComma: "es5"
bracketSpacing: true
bracketSameLine: false
arrowParens: "always"
proseWrap: "preserve"
htmlWhitespaceSensitivity: "css"
endOfLine: "lf"
embeddedLanguageFormatting: "auto"
singleAttributePerLine: false
experimentalTernaries: false

overrides:
  - files: "*.json"
    options:
      printWidth: 200
      trailingComma: "none"
  - files: "*.{yml,yaml}"
    options:
      singleQuote: false
      tabWidth: 2
  - files: "*.md"
    options:
      printWidth: 80
      proseWrap: "always"
      embeddedLanguageFormatting: "off"
  - files: "*.{css,scss,less}"
    options:
      singleQuote: false
  - files: "*.{graphql,gql}"
    options:
      printWidth: 80
  - files: "*.svg"
    options:
      parser: "html"