version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: parking-postgres
    environment:
      POSTGRES_DB: parking_db
      POSTGRES_USER: parking_user
      POSTGRES_PASSWORD: parking_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schemas/postgresql:/docker-entrypoint-initdb.d
    networks:
      - parking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking_user -d parking_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=32MB
      -c huge_pages=off
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  # PostgreSQL with TimescaleDB for time-series data
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: parking-timescaledb
    environment:
      POSTGRES_DB: parking_tsdb
      POSTGRES_USER: parking_user
      POSTGRES_PASSWORD: parking_password
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    networks:
      - parking-network
    command: >
      postgres
      -c shared_preload_libraries=timescaledb
      -c timescaledb.telemetry_level=off

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: parking-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./schemas/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - parking-network
    command: redis-server /usr/local/etc/redis/redis.conf --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Sentinel for HA
  redis-sentinel:
    image: redis:7-alpine
    container_name: parking-redis-sentinel
    ports:
      - "26379:26379"
    volumes:
      - ./schemas/redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    networks:
      - parking-network
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: parking-elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=parking-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.monitoring.collection.enabled=true
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./schemas/elasticsearch:/usr/share/elasticsearch/config/scripts
    networks:
      - parking-network
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana for visualization
  kibana:
    image: kibana:8.11.0
    container_name: parking-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    ports:
      - "5601:5601"
    networks:
      - parking-network
    depends_on:
      - elasticsearch

  # Logstash for data processing
  logstash:
    image: logstash:8.11.0
    container_name: parking-logstash
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - ./schemas/logstash/pipeline:/usr/share/logstash/pipeline
      - ./schemas/logstash/config:/usr/share/logstash/config
    ports:
      - "5000:5000"
      - "9600:9600"
    networks:
      - parking-network
    depends_on:
      - elasticsearch

  # MongoDB for unstructured data
  mongodb:
    image: mongo:7
    container_name: parking-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: parking
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - parking-network

  # InfluxDB for time-series metrics
  influxdb:
    image: influxdb:2.7
    container_name: parking-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: password123
      DOCKER_INFLUXDB_INIT_ORG: parking
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-token
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - parking-network

  # MinIO for S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: parking-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - parking-network
    command: server /data --console-address ":9001"

  # PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: parking-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@parking.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - parking-network
    depends_on:
      - postgres
      - timescaledb

  # Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: parking-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - parking-network
    depends_on:
      - redis

  # MongoDB Express for MongoDB management
  mongo-express:
    image: mongo-express:latest
    container_name: parking-mongo-express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "8082:8081"
    networks:
      - parking-network
    depends_on:
      - mongodb

  # Data migration service
  migration-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parking-migration
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=parking_db
      - DB_USER=parking_user
      - DB_PASSWORD=parking_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_HOSTS=elasticsearch:9200
    volumes:
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
    networks:
      - parking-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    command: python scripts/init_db.py

  # Backup service
  backup-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parking-backup
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=parking_db
      - DB_USER=parking_user
      - DB_PASSWORD=parking_password
      - BACKUP_DIR=/backups
      - BACKUP_RETENTION_DAYS=30
    volumes:
      - ./backups:/backups
      - ./scripts:/app/scripts
    networks:
      - parking-network
    depends_on:
      - postgres
    command: |
      sh -c "
      while true; do
        python scripts/backup_db.py
        sleep 86400
      done
      "

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: parking-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    networks:
      - parking-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: parking-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    networks:
      - parking-network
    depends_on:
      - prometheus

networks:
  parking-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  timescaledb_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  mongodb_data:
    driver: local
  influxdb_data:
    driver: local
  minio_data:
    driver: local
  pgadmin_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local