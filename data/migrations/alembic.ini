# parking-management/data/migrations/alembic.ini

# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = parking_management.data.migrations

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python>=3.9 or backports.zoneinfo library.
# Any required deps can installed by adding `alembic[tz]` to the pip requirements
# string value is passed to ZoneInfo()
# leave blank for localtime
# timezone = 

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command
# regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without a source .py file
# sourceless = false

# version location specification; this defaults to script_location/versions. When using multiple version 
# directories, initial revisions must be specified with --version-path
# version_locations = %(here)s/bar %(here)s/bat alembic/versions

# the output encoding used when revision files are written
# output_encoding = utf-8

sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/parking_management

# Elasticsearch configuration (custom section for vehicle data quality checks)
[elasticsearch]
hosts = localhost:9200
# username = 
# password = 
# use_ssl = false
# verify_certs = true
# ca_certs = 
# timeout = 30
# max_retries = 3
# retry_on_timeout = true

[postgresql]
# PostgreSQL specific settings
pool_size = 10
max_overflow = 20
pool_timeout = 30
pool_recycle = 3600
echo = false

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic,elasticsearch

[handlers]
keys = console,file

[formatters]
keys = generic,verbose

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_elasticsearch]
level = INFO
handlers =
qualname = elasticsearch

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[handler_file]
class = handlers.RotatingFileHandler
args = ('migration.log', 'a', 10485760, 5)
level = NOTSET
formatter = verbose

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[formatter_verbose]
format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt = %Y-%m-%d %H:%M:%S

# Version table configuration
[version_table]
# Name of the table used to track schema versions
# Defaults to 'alembic_version'
table_name = migration_version
# Schema to use for the version table
# schema = public

# Migration environment configuration
[environment]
# Additional paths to add to Python path
# extra_paths = /path/to/extra/modules

# Pre-migration hooks
# pre_migration_hook = scripts/pre_migration.py
# post_migration_hook = scripts/post_migration.py

# Data migration settings
[data_migration]
# Batch size for data migrations
batch_size = 1000
# Timeout for long-running migrations (seconds)
timeout = 3600
# Retry attempts for failed migrations
retry_attempts = 3
# Retry delay (seconds)
retry_delay = 5

# Vehicle data quality check configuration
[vehicle_quality]
# Quality thresholds (percentage)
min_license_plate_coverage = 90
min_vin_coverage = 90
max_expired_registration = 5
max_expired_insurance = 5
max_blacklisted_percentage = 2

# Alert settings
[alerts]
# Email alerts
email_enabled = false
smtp_host = localhost
smtp_port = 25
from_address = migrations@parking-management.com
to_addresses = admin@parking-management.com

# Slack alerts
slack_enabled = false
slack_webhook_url = https://hooks.slack.com/services/xxx/yyy/zzz
slack_channel = #migrations

# Webhook alerts
webhook_enabled = false
webhook_url = http://localhost:8080/migration-alerts

# Backup configuration
[backup]
# Enable automatic backup before destructive migrations
enabled = true
# Backup directory
backup_dir = /var/backups/parking-management
# Backup format: sql, custom, directory
format = sql
# Compression: gzip, bzip2, none
compression = gzip
# Retention days
retention_days = 30

# Multi-database support
[databases]
# Primary database
primary = postgresql://postgres:postgres@localhost:5432/parking_management
# Read replica (for reporting)
replica = postgresql://postgres:postgres@localhost:5432/parking_management_replica
# Archive database
archive = postgresql://postgres:postgres@localhost:5432/parking_archive

# Custom migration commands
[commands]
# Add custom Alembic commands here
quality_check = python -m parking_management.data.migrations.quality_check
generate_report = python -m parking_management.data.migrations.generate_report
validate_data = python -m parking_management.data.migrations.validate

# Feature flags
[features]
# Enable/disable specific features
parallel_migrations = false
dry_run = false
validate_before_migrate = true
validate_after_migrate = true
notify_on_completion = true
auto_backup = true

# Performance settings
[performance]
# Number of worker threads for parallel migrations
worker_threads = 4
# Statement timeout (milliseconds)
statement_timeout = 30000
# Lock timeout (milliseconds)
lock_timeout = 5000

# Environment-specific overrides
# These can be overridden by environment variables or command line args

[production]
sqlalchemy.url = ${PROD_DB_URL}
elasticsearch.hosts = ${PROD_ES_HOSTS}
backup.enabled = true
performance.worker_threads = 8

[staging]
sqlalchemy.url = ${STAGING_DB_URL}
elasticsearch.hosts = ${STAGING_ES_HOSTS}
backup.enabled = false
features.dry_run = true

[development]
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/parking_management_dev
elasticsearch.hosts = localhost:9200
backup.enabled = false
features.dry_run = false
sqlalchemy.echo = true

# Testing configuration
[testing]
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/parking_management_test
elasticsearch.hosts = localhost:9200
backup.enabled = false
features.validate_before_migrate = false
features.validate_after_migrate = false