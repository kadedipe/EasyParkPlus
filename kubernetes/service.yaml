# parking-management/kubernetes/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: parking-frontend-service
  namespace: production
  labels:
    app: parking-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: parking-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: parking-frontend-lb
  namespace: production
  labels:
    app: parking-frontend
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
    - port: 443
      targetPort: 443
      protocol: TCP
      name: https
  selector:
    app: parking-frontend